<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的衣橱">
<meta name="theme-color" content="#3f5b4a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>我的衣橱</title>
<style>
  :root{
    --bg:#f7f5f1; --card:#ffffff; --ink:#2b2823; --sub:#7c756a; --line:#e9e4da;
    --accent:#3f5b4a; --accent-soft:#eef2ed; --warn:#b4552f; --warn-soft:#fbeee8;
    --blue:#3a5f8f; --blue-soft:#eaeff5;
    --radius:18px; --shadow:0 2px 10px rgba(43,40,35,.06), 0 12px 30px rgba(43,40,35,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;padding-bottom:110px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;}
  header{position:sticky;top:0;z-index:20;background:rgba(247,245,241,.94);
    backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
  .head-in{max-width:1000px;margin:0 auto;padding:14px 18px 8px;display:flex;align-items:center;gap:10px}
  .brand{font-size:19px;font-weight:700;letter-spacing:.4px}
  .brand small{display:block;font-size:11px;font-weight:400;color:var(--sub);letter-spacing:1.6px}
  .head-spacer{flex:1}
  .icon-btn{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:12px;
    padding:7px 11px;font-size:13px;cursor:pointer;font-family:inherit}
  .icon-btn:hover{color:var(--ink);border-color:#d8d2c6}
  .who{max-width:1000px;margin:0 auto;padding:0 18px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .who button{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:12px;
    padding:9px 0;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .who button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .who button:last-child{grid-column:1 / -1}
  .storeline{max-width:1000px;margin:0 auto;padding:0 18px 8px;font-size:11.5px;color:var(--sub)}
  .storeline span{letter-spacing:.3px}
  nav.tabs{max-width:1000px;margin:0 auto;padding:0 14px 11px;display:flex;gap:6px}
  nav.tabs button{flex:1;border:none;background:transparent;color:var(--sub);font-size:14px;
    padding:9px 0;border-radius:12px;cursor:pointer;font-weight:600;font-family:inherit;white-space:nowrap}
  nav.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  main{max-width:1000px;margin:0 auto;padding:18px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chips.xs .chip{font-size:13px;padding:4px 12px}
  .chip{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;
    padding:6px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.15s}
  .chip:hover{border-color:#d5cec1}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .frow .fl{font-size:12px;color:var(--sub);flex:0 0 auto;min-width:44px}
  .hint{color:var(--sub);font-size:13px;margin:12px 2px 16px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
  .sec{margin:26px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .sec h2{margin:0;font-size:16px}
  .sec .cnt{font-size:12.5px;color:#fff;background:var(--ink);border-radius:999px;padding:1px 9px}
  .sec .cnt.warn{background:var(--warn)}
  .sec .cnt.zero{background:#cdc7ba}
  .sec .sp{flex:1}

  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:12px}
  .topic{overflow:hidden;border-radius:14px;border:1px solid var(--line);background:#fff;margin-top:10px}
  .crow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
  .crow:last-child{border-bottom:none}
  .crow.sel{background:#f2f7f3}
  .cbox{width:20px;height:20px;border-radius:6px;border:1.5px solid #d5cec1;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;cursor:pointer}
  .cbox.on{background:var(--accent);border-color:var(--accent)}
  .crow img{width:52px;height:66px;border-radius:10px;object-fit:cover;background:#f0ece4;flex:0 0 auto}
  .cinfo{flex:1;min-width:0}
  .cname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmeta{font-size:11.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cact{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
  .cact .mini{padding:5px 11px;font-size:12px}
  .cartbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0 8px}
  .cartbar .who{margin:0;padding:0;max-width:none;flex:0 0 auto}
  table.tb{border-collapse:collapse;width:100%;font-size:12.5px;min-width:980px}
  .tb th,.tb td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
  .tb th{background:#faf8f4;font-weight:600;color:var(--sub)}
  .tb tr:last-child td{border-bottom:none}
  .tb img{width:38px;height:50px;border-radius:7px;object-fit:cover;display:block;background:#f0ece4}
  .tb tr.retired td{opacity:.45}
  .tb tr.retired td:nth-child(2){text-decoration:line-through}
  .tb .cut{max-width:210px;overflow:hidden;text-overflow:ellipsis}
  .tbl-title{display:flex;align-items:baseline;gap:10px;margin:22px 0 2px}
  .tbl-title h3{margin:0;font-size:15px}
  .tbl-title .n{font-size:12.5px;color:var(--sub)}

  .outfit{padding:16px;margin-bottom:14px}
  .outfit-top{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
  .outfit-no{font-size:12px;color:var(--sub);letter-spacing:1px}
  .score{font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:999px}
  .pieces{display:flex;gap:10px;margin:12px 0 10px;overflow-x:auto;padding-bottom:2px}
  .piece{width:104px;flex:0 0 auto;text-align:center}
  .piece .ph{width:104px;height:132px;border-radius:14px;overflow:hidden;background:#f0ece4;border:1px solid var(--line)}
  .piece img{width:100%;height:100%;object-fit:cover;display:block}
  .piece .nm{font-size:11.5px;color:var(--sub);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .why{font-size:13.5px;color:#4a453d;background:#faf8f4;border-radius:12px;padding:10px 12px}
  .outfit-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .mini{border:none;background:#f2efe8;color:#57513f;border-radius:10px;padding:7px 13px;
    font-size:13px;cursor:pointer;font-family:inherit}
  .mini:hover{background:#eae5da}
  .mini.on{background:var(--accent);color:#fff}
  .mini.ghost{background:#fff;border:1px solid var(--line)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;margin-top:14px}
  .item{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
    cursor:pointer;box-shadow:0 1px 4px rgba(43,40,35,.04);transition:.15s}
  .item:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .item .ph{aspect-ratio:3/4;background:#f0ece4;overflow:hidden}
  .item img{width:100%;height:100%;object-fit:cover;display:block}
  .item .meta{padding:8px 10px 10px}
  .item .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .tg{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:5px;margin-top:3px}
  .dot{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.12);flex:0 0 auto}
  .badge{position:absolute;top:7px;left:7px;font-size:10.5px;padding:2px 7px;border-radius:8px;
    background:rgba(43,40,35,.78);color:#fff;backdrop-filter:blur(4px);letter-spacing:.3px;max-width:70%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge.b{background:rgba(58,95,143,.9)}
  .badge.w{background:rgba(180,85,47,.92)}
  .item.sel{outline:2.5px solid var(--accent);outline-offset:-2px}
  .tick{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;
    background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
  .item.sel .tick{background:var(--accent);border-color:var(--accent)}

  .row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .th{width:52px;height:66px;border-radius:10px;overflow:hidden;background:#f0ece4;flex:0 0 auto}
  .row .th img{width:100%;height:100%;object-fit:cover;display:block}
  .row .bd{flex:1;min-width:0}
  .row .t1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .t2{font-size:12px;color:var(--sub);margin-top:2px}
  .tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;background:var(--warn-soft);color:var(--warn);margin-right:5px}
  .miss{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 8px;
    background:#fdecea;color:#c0392b;border:1px solid #f3c2b8;margin-right:6px}
  .lab-red{color:#c0392b !important;font-weight:700}
  .tag.b{background:var(--blue-soft);color:var(--blue)}
  .tag.g{background:var(--accent-soft);color:var(--accent)}

  .locgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
  .loc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;
    box-shadow:0 1px 4px rgba(43,40,35,.04);transition:.15s}
  .loc:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .loc .code{font-size:16px;font-weight:700;letter-spacing:.4px}
  .loc .place{font-size:12px;color:var(--sub);margin-top:2px}
  .loc .thumbs{display:flex;gap:5px;margin-top:10px}
  .loc .thumbs div{width:38px;height:48px;border-radius:8px;overflow:hidden;background:#f0ece4}
  .loc .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
  .loc .more{font-size:12px;color:var(--sub);margin-top:8px}

  .gaprow{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .gaprow:last-child{border-bottom:none}
  .cbx{width:20px;height:20px;border-radius:6px;border:1.5px solid #d5cec1;flex:0 0 auto;margin-top:2px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
  .cbx.on{background:var(--accent);border-color:var(--accent)}
  .gaprow.done .t1{text-decoration:line-through;color:var(--sub)}

  #fabWrap{position:fixed;right:20px;bottom:22px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  #fab{border:none;background:var(--accent);color:#fff;border-radius:999px;padding:14px 22px;
    font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
    box-shadow:0 8px 24px rgba(63,91,74,.32)}
  #fab:hover{filter:brightness(1.08)}
  .fab-mini{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;
    padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .fab-mini:hover{color:var(--ink)}

  #batchbar{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;gap:8px;align-items:center;
    box-shadow:0 -6px 24px rgba(43,40,35,.10);flex-wrap:wrap}
  #batchbar.on{display:flex}
  #batchbar .cnt{font-size:13px;color:var(--sub);margin-right:auto}

  .mask{position:fixed;inset:0;background:rgba(30,28,24,.42);z-index:40;display:none;align-items:flex-end;justify-content:center}
  .mask.on{display:flex}
  .sheet{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;
    padding:8px 20px 26px;animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;
    background:#fff;padding:14px 0 10px;z-index:2}
  .sheet-head h3{margin:0;font-size:16px}
  .x{border:none;background:#f2efe8;border-radius:10px;width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--sub)}
  .field{margin:16px 0}
  .lab{font-size:12.5px;color:var(--sub);margin-bottom:8px;letter-spacing:.4px}
  .pick{border:1.5px dashed #d9d2c5;border-radius:16px;background:#faf8f4;aspect-ratio:4/3;
    display:flex;align-items:center;justify-content:center;color:var(--sub);cursor:pointer;overflow:hidden;position:relative;text-align:center}
  .pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pick .tip{font-size:13px;position:relative;z-index:1;padding:18px;background:rgba(255,255,255,.86);border-radius:10px}
  input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    font-size:15px;font-family:inherit;color:var(--ink);background:#fff;outline:none}
  input[type=text]:focus{border-color:var(--accent)}
  .cta{width:100%;border:none;background:var(--accent);color:#fff;border-radius:14px;padding:14px;
    font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
  .cta:disabled{background:#c9c4b8;cursor:not-allowed}
  .danger{background:#fff;color:var(--warn);border:1px solid #f0d9cf}
  .empty{text-align:center;color:var(--sub);padding:40px 20px}
  .empty .big{font-size:38px;margin-bottom:8px;opacity:.45}
  .colorbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .swatch{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px 5px 7px;
    font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;color:var(--sub)}
  .swatch.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#2b2823;color:#fff;
    padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
  .toast.on{opacity:1}
  .sub{font-size:12px;color:var(--sub)}
  #tipbar{display:flex;gap:8px;align-items:center;margin:0 0 14px;
    background:#fffdf8;border:1px solid #efe0cf;border-radius:14px;padding:10px 12px;font-size:12.5px;
    color:#6b5b4a;line-height:1.4}
  #tipbar b{flex:0 0 auto;color:#8a5a3b}
  #tipbar span{flex:1}
  #tipbar.hide{display:none}
  #warnbar{display:none;padding:12px 18px;background:#fbeee8;border-bottom:1px solid #f0d9cf;
    font-size:13px;color:#8a4326;line-height:1.5}
  #warnbar.on{display:flex;align-items:center;gap:10px}
  #warnbar b{flex:0 0 auto}
  #warnbar span{flex:1;max-width:840px}
  #warnbar a{color:#8a4326}
  #warnbar small{opacity:.7;font-size:11.5px}
  #warnbar .mini{flex:0 0 auto;background:#fff;border:1px solid #f0d9cf}
  #dropzone{position:fixed;inset:10px;z-index:50;display:none;align-items:center;justify-content:center;
    border:3px dashed var(--accent);border-radius:24px;background:rgba(247,245,241,.86);pointer-events:none}
  #dropzone.on{display:flex}
  #dropzone div{text-align:center;color:var(--accent)}
  #dropzone b{display:block;font-size:20px;margin-bottom:6px}
  #dropzone small{color:var(--sub);font-size:13px}
  #quickbar{position:fixed;left:12px;right:12px;bottom:14px;z-index:35;display:none;align-items:center;gap:10px;
    background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 12px;
    box-shadow:0 12px 34px rgba(43,40,35,.18)}
  #quickbar.on{display:flex}
  #quickbar img{width:44px;height:56px;border-radius:9px;object-fit:cover;background:#f0ece4;flex:0 0 auto}
  #quickbar .qt{font-size:13px;color:var(--ink);flex:1;line-height:1.35}
  #quickbar .qt small{display:block;color:var(--sub);font-size:11.5px}
  #printArea{display:none}
  #lightbox{position:fixed;inset:0;z-index:80;background:rgba(20,18,16,.92);display:none;
    align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
  #lightbox.on{display:flex}
  #lightbox img{max-width:94vw;max-height:88vh;border-radius:12px;object-fit:contain;background:#111}
  #lightbox .tip{position:absolute;bottom:26px;left:0;right:0;text-align:center;color:#ddd;font-size:13px}
  @media print{
    body{background:#fff;padding:0}
    header,main,#fabWrap,#batchbar,.mask,.toast,#quickbar,#dropzone{display:none !important}
    #printArea{display:block;padding:0}
    .pbox{page-break-after:always;padding:10mm}
    .pbox:last-child{page-break-after:auto}
    .pbox h3{font-size:20px;margin:0 0 4px}
    .pbox .pmeta{font-size:12px;color:#666;margin-bottom:10px}
    .pbox .plist{font-size:12px;columns:2;column-gap:8mm}
    .pbox .plist div{padding:2px 0;border-bottom:1px dotted #ddd;break-inside:avoid}
  }
  @media (max-width:560px){
    main{padding:14px}
    .piece{width:88px}.piece .ph{width:88px;height:112px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
    nav.tabs button{font-size:13px}
    .who button{font-size:12px;padding:8px 0}
    /* 窄屏：标题一行，按钮换行铺满，不再挤出画面 */
    .head-in{flex-wrap:wrap;padding:10px 14px 6px;gap:8px}
    .head-in .brand{flex:1 1 100%}
    .head-in .head-spacer{display:none}
    .icon-btn{flex:1 1 auto;min-width:0;padding:7px 6px;font-size:12px;text-align:center}
    #fabWrap{gap:6px;bottom:16px;right:14px}
    #fab{padding:12px 18px;font-size:14px}
    .fab-mini{padding:7px 13px;font-size:12.5px}
    .cartbar .mini{font-size:12px;padding:6px 10px}
    .sheet{padding:8px 14px 22px}
  }
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div class="brand">我的衣橱<small id="brandVer">WARDROBE</small></div>
    <div class="head-spacer"></div>
    <button class="icon-btn" id="btnCloud">云端</button>
    <button class="icon-btn" id="btnAutoBak">自动备份</button>
    <button class="icon-btn" id="btnFind">查找</button>
    <button class="icon-btn" id="btnExport">备份</button>
    <button class="icon-btn" id="btnImport">恢复</button>
    <button class="icon-btn" id="btnPrint">位置单</button>
  </div>
  <div class="who" id="whoBox"></div>
  <div class="storeline"><span id="storeStatus">正在读取数据…</span></div>
  <nav class="tabs">
    <button data-tab="wardrobe" class="on">衣橱</button>
    <button data-tab="pending">新进</button>
    <button data-tab="table">总表</button>
    <button data-tab="season">换季</button>
    <button data-tab="lists">清单</button>
  </nav>
</header>
<div id="warnbar"></div>

<main>
  <!-- 衣橱 -->
  <section id="tab-wardrobe">
    <div id="tipbar">
      <b>照片进来</b>
      <span id="tipText">拖拽 / Ctrl+V 粘贴 / 点右下「选照片」，三种都行，可一次多张。</span>
      <button class="mini ghost" id="tipClose">不再提示</button>
    </div>
    <div class="frow"><span class="fl">季节</span><div class="chips xs" id="fSeason"></div></div>
    <div class="frow"><span class="fl">频率</span><div class="chips xs" id="fWear"></div></div>
    <div class="frow"><span class="fl">位置</span><div class="chips xs" id="fLoc"></div></div>
    <div class="frow"><span class="fl">大类</span><div class="chips xs" id="fDept"></div></div>
    <div class="frow"><span class="fl">品类</span><div class="chips xs" id="fCat"></div></div>
    <div class="frow"><span class="fl">款式</span><div class="chips xs" id="fSub"></div></div>
    <div class="frow" id="sleeveRow" style="display:none"><span class="fl">袖长</span><div class="chips xs" id="fSleeve"></div></div>

/* ================= 状态 ================= */
const KEY = 'wardrobe.v3';
const BAK = 'wardrobe.bak';
let DB = {items:[], saved:[], locations:[], gaps:[], owner:'connie', memOnly:false};
rebuildCatalog();   // 先用默认目录把 CATS/SUBCATS 填上，后续 load 会用库里保存的目录再重建一次
let view = {dept:'全部', season:'全部', wear:'全部', loc:'全部', cat:'全部', sub:'全部', sleeve:'全部', mat:'全部'};

/* ================= 存储层 ================= */
const Store = {
  mode:'pending', idb:null, err:'',
  lsOk(){
    try{ const k='__wtest__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  },
  openIdb(){
    return new Promise((res,rej)=>{
      try{
        if(!window.indexedDB) return rej(new Error('no indexedDB'));
        const req = window.indexedDB.open('wardrobeDB', 1);
        req.onupgradeneeded = ()=>{ try{ req.result.createObjectStore('kv'); }catch(e){} };
        req.onsuccess = ()=> res(req.result);
        req.onerror = ()=> rej(req.error || new Error('idb error'));
        setTimeout(()=>rej(new Error('idb timeout')), 3000);
      }catch(e){ rej(e); }
    });
  },
  async open(){
    this.err = '';
    try{ this.idb = await this.openIdb(); this.mode='idb'; return this.mode; }
    catch(e){ console.warn('IndexedDB 不可用', e); this.err = 'IndexedDB 打不开：' + ((e&&e.message)||e); }
    if(this.lsOk()){ this.mode='ls'; return this.mode; }
    this.err += ' ／ localStorage 也被禁';
    this.mode='memory'; return this.mode;
  },
  get(key){
    if(this.mode==='idb'){
      return new Promise(res=>{
        try{
          const rq = this.idb.transaction('kv','readonly').objectStore('kv').get(key);
          rq.onsuccess = ()=> res(rq.result || null);
          rq.onerror = ()=> res(null);
        }catch(e){ res(null); }
      });
    }
    if(this.mode==='ls'){ try{ return Promise.resolve(localStorage.getItem(key)); }catch(e){ return Promise.resolve(null); } }
    return Promise.resolve(null);
  },
  set(key,val){
    if(this.mode==='idb'){
      return new Promise(res=>{
        try{
          const tx = this.idb.transaction('kv','readwrite');
          tx.objectStore('kv').put(val,key);
          tx.oncomplete = ()=> res(true);
          tx.onerror = ()=> res(false);
          tx.onabort = ()=> res(false);
        }catch(e){ res(false); }
      });
    }
    if(this.mode==='ls'){ try{ localStorage.setItem(key,val); return Promise.resolve(true); }catch(e){ return Promise.resolve(false); } }
    return Promise.resolve(false);
  }
};

function save(){
  // 还没成功读到过数据、手上又是空的 → 绝不写，避免把库里的数据盖成空
  if(!DB.loaded && DB.items.length === 0){ updateStoreStatus(); return; }
  const payload = JSON.stringify({
    items:DB.items, saved:DB.saved, locations:DB.locations, gaps:DB.gaps, owner:DB.owner,
    intakes: DB.intakes || [], catalog: DB.catalog || null, cloud: DB.cloud || null,
    tipClosed: DB.tipClosed || false
  });
  DB.lastSize = payload.length/1048576;
  if(Store.mode==='memory' || Store.mode==='pending'){ DB.memOnly = true; updateStoreStatus(); return; }
  Store.set(KEY, payload).then(ok=>{
    if(ok){
      DB.lastSaved = Date.now();
      Store.set(BAK, payload);          // 影子副本：主档被写坏也有后手
      scheduleAutoBackup();              // 同时写到本机文件（开了的话，节流 3 秒）
      scheduleCloudPush();               // 云端开了就推一份（节流 10 秒）
      updateStoreStatus();
      return;
    }
    if(Store.mode==='ls'){
      Store.openIdb().then(idb=>{ Store.idb=idb; Store.mode='idb'; return Store.set(KEY,payload); })
        .then(ok2=>{ if(!ok2) throw new Error('idb fail'); DB.lastSaved = Date.now(); updateStoreStatus(); })
        .catch(()=>{ DB.memOnly = true; updateStoreStatus(); toast('存不进去了，先点「备份」导出'); });
    }else{
      DB.memOnly = true; updateStoreStatus(); toast('存不进去了，先点「备份」导出');
    }
  });
}
/* ================= 自动备份到本机文件 ================= */
let autoFileHandle = null;
let autoFileState = 'off';   // off / on / need-permission
async function pickAutoBackupFile(){
  if(!window.showSaveFilePicker){ toast('这个浏览器不支持选文件，请用 Edge / Chrome 打开'); return; }
  try{
    const h = await window.showSaveFilePicker({
      suggestedName: '我的衣橱_自动备份.json',
      types: [{ description: 'JSON 备份', accept: {'application/json': ['.json']} }]
    });
    autoFileHandle = h;
    autoFileState = 'on';
    try{ await Store.set('fsHandle', h); }catch(e){ console.warn('句柄存不下', e); }
    await writeAutoBackup();
    toast('已开启：每次修改都会自动写进这个文件');
    updateStoreStatus();
  }catch(e){
    console.warn('选文件失败', e);
  }
}
async function restoreAutoBackupHandle(){
  try{
    const h = await Store.get('fsHandle');
    if(!h || !h.queryPermission) return;
    autoFileHandle = h;
    const perm = await h.queryPermission({mode:'readwrite'}).catch(()=> 'prompt');
    autoFileState = perm === 'granted' ? 'on' : 'need-permission';
  }catch(e){}
}
let autoBakTimer = null;
function scheduleAutoBackup(){
  if(!autoFileHandle) return;
  clearTimeout(autoBakTimer);
  autoBakTimer = setTimeout(function(){ writeAutoBackup(); }, 3000);
}
async function writeAutoBackup(){
  if(!autoFileHandle) return;
  try{
    const payload = JSON.stringify({
      items:DB.items, saved:DB.saved, locations:DB.locations, gaps:DB.gaps, owner:DB.owner,
      exportedAt: new Date().toISOString()
    });
    const w = await autoFileHandle.createWritable();
    await w.write(payload);
    await w.close();
    DB.lastAutoFile = Date.now();
    autoFileState = 'on';
    updateStoreStatus();
  }catch(e){
    console.warn('自动备份写入失败', e);
    autoFileState = 'need-permission';
    updateStoreStatus();
  }
}
/* ================= 云端同步（Supabase 快照） ================= */
const CLOUD_SQL = "create table if not exists wardrobe (id text primary key, payload jsonb, updated_at timestamptz default now());\n"
  + "alter table wardrobe enable row level security;\n"
  + "create policy \"allow anon all\" on wardrobe for all using (true) with check (true);";
function cloudCfg(){ return DB.cloud || null; }
function cloudReady(){ const c = cloudCfg(); return !!(c && c.url && c.key); }
function cloudRoom(){ const c = cloudCfg(); return (c && c.room) || 'main'; }
function cloudHeaders(c){
  return {
    'apikey': c.key,
    'Authorization': 'Bearer ' + c.key,
    'Content-Type': 'application/json',
    'Prefer': 'resolution=merge-duplicates'
  };
}
async function cloudPush(silent){
  const c = cloudCfg();
  if(!cloudReady()){ if(!silent) toast('还没配置云端'); return false; }
  const payload = {
    items: DB.items, saved: DB.saved, locations: DB.locations, gaps: DB.gaps,
    intakes: DB.intakes || [], owner: DB.owner, pushedAt: new Date().toISOString()

function seasonByMonth(){
  const m = new Date().getMonth()+1;
  if(m>=6&&m<=8) return '夏';
  if(m===12||m<=2) return '冬';
  if(m>=9&&m<=11) return '秋';
  return '春';
}
function migrate(){
  if(!DB.catalog) DB.catalog = JSON.parse(JSON.stringify(DEFAULT_CATALOG));
  rebuildCatalog();
  DB.items = DB.items || []; DB.saved = DB.saved || [];
  DB.locations = DB.locations || []; DB.gaps = DB.gaps || [];
  DB.locations.forEach(function(l){
    if(l.type === '区'){ l.type = '柜'; }
    if(['箱','盒','抽','柜'].indexOf(l.type) < 0){ l.type = '箱'; }
  });
  // 旧 boxes → locations
  if(DB.boxes && DB.boxes.length){
    DB.boxes.forEach(b=>{
      if(!DB.locations.find(l=>l.id===b.id)){
        DB.locations.push({id:b.id, type:'箱', code:b.code||'B01', detail:b.place||''});
      }
    });
    DB.boxes = null;
  }
  const omap = {'我':'connie','先生':'daniel','Kevin':'kevin','家':'home','connie':'connie','daniel':'daniel','kevin':'kevin','home':'home'};
  const catFix = {'外套':'大衣','睡衣':'家居服','家居用品':'厨房用品','帽子':'帽子'};
  DB.items.forEach(it=>{
    it.owner = omap[it.owner] || 'connie';
    if(catFix[it.cat]) it.cat = catFix[it.cat];
    if(it.cat !== '待分类' && !CATS.includes(it.cat)){
      const target = SUB2CAT[it.cat] || OLD_CAT[it.cat];
      if(SUB2CAT[it.cat] && !it.sub) it.sub = it.cat;
      it.cat = target || CATS[0] || '上装';
    }
    let s = Array.isArray(it.season) ? it.season.slice() : [];
    const flat = [];
    s.forEach(function(x){
      if(x==='四季'){ flat.push('春','夏','秋','冬'); }
      else if(x==='春秋'){ flat.push('春','秋'); }
      else if(SEASONS.indexOf(x) >= 0){ flat.push(x); }
    });
    it.season = [...new Set(flat)];
    const wmap = {'常穿':'常穿','偶尔':'偶尔穿','偶尔穿':'偶尔穿','没穿':'从未穿','从未穿':'从未穿'};
    it.wear = wmap[it.wear] || '';
    if(it.box && !it.locId) it.locId = it.box;
    delete it.box;
    if(!it.locId) it.locId = '';
    if(!it.reason) it.reason = '';
    if(!it.desc) it.desc = '';
    const scenemap = {'正式':'正装'};
    it.scene = (it.scene||['休闲']).map(x=>scenemap[x]||x).filter(x=>SCENES.includes(x));
    if(!it.scene.length) it.scene = ['休闲'];
    it.boughtAt = it.boughtAt || '';
    it.retiredAt = it.retiredAt || '';
    it.retirePlan = it.retirePlan || '';
    it.retireReason = it.retireReason || '';
    it.pair = it.pair || '';
    it.size = it.size || '';
    it.cond = it.cond || '';
    if(!it.no) it.no = nextNo(it.owner);
    if(!it.sleeve) it.sleeve = '';
    if(!it.material) it.material = '';
    if(!it.sub) it.sub = '';
  });
  if(!DB.owner) DB.owner = 'connie';
}
async function load(){
  const mode = await Store.open();
  // 依次尝试：主档 → 影子副本 → 旧版 v2 → 浏览器 localStorage
  const cands = [];
  try{ const a = await Store.get(KEY); if(a) cands.push(['主档', a]); }catch(e){}
  try{ const b = await Store.get(BAK); if(b) cands.push(['影子副本', b]); }catch(e){}
  try{ const c = await Store.get('wardrobe.v2'); if(c) cands.push(['旧版v2', c]); }catch(e){}

    if(d) cands.push(['浏览器localStorage', d]);
  }catch(e){}

  let best = null, bestName = '';
  for(const c of cands){
    try{
      const o = JSON.parse(c[1]);
      const n = (o.items||[]).length;
      if(!best || n > best.name_len){ best = {o:o, name_len:n, tag:c[0]}; bestName = c[0]; }

/* ================= 取色 ================= */
function rgb2hsv(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0;
  if(d){ if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360; }
  return {h, s: mx? d/mx : 0, v: mx};
}
function colorNameOf(r,g,b){
  const {h,s,v} = rgb2hsv(r,g,b);
  if(s <= 0.13){
    if(v >= 0.86) return '白';
    if(v <= 0.22) return '黑';
    if(h>=20&&h<=50&&v>0.7) return '米';
    return '灰';
  }
  if(v > 0.72 && s < 0.45 && (h >= 320 || h < 12)) return '粉';
  if(s < 0.42 && v < 0.62 && h >= 10 && h <= 45) return '棕';
  if(s < 0.26 && v > 0.74 && h >= 25 && h <= 55) return '米';
  if(h < 16 || h >= 345) return '红';
  if(h < 42) return s>0.6&&v>0.75 ? '橙' : '棕';
  if(h < 70) return '黄';
  if(h < 168) return '绿';
  if(h < 250) return '蓝';
  if(h < 300) return '紫';
  if(h < 345) return (v>0.72&&s<0.5) ? '粉' : '紫';
  return '红';
}
function dominantColor(img){
  const S = 64;
  const c = document.createElement('canvas'); c.width=S; c.height=S;
  const ctx = c.getContext('2d', {willReadFrequently:true});
  const side = Math.min(img.width, img.height), crop = side*0.6;
  ctx.drawImage(img, (img.width-crop)/2, (img.height-crop)/2, crop, crop, 0, 0, S, S);
  const d = ctx.getImageData(0,0,S,S).data;
  const bk = {};
  for(let i=0;i<d.length;i+=4){
    const k = ((d[i]>>4)<<8)|((d[i+1]>>4)<<4)|(d[i+2]>>4);
    const o = bk[k] || (bk[k]={n:0,r:0,g:0,b:0});
    o.n++; o.r+=d[i]; o.g+=d[i+1]; o.b+=d[i+2];
  }
  let best=null; for(const k in bk){ if(!best||bk[k].n>best.n) best=bk[k]; }
  if(!best) return {name:'灰', hex:'#9b9b9b'};
  const r=Math.round(best.r/best.n), g=Math.round(best.g/best.n), b=Math.round(best.b/best.n);
  return {name: colorNameOf(r,g,b), hex:'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')};
}
function compress(file, maxSide=660){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const sc = Math.min(1, maxSide/Math.max(img.width,img.height));
        const w = Math.round(img.width*sc), h = Math.round(img.height*sc);
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve({dataURL:c.toDataURL('image/jpeg',0.68), img});
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ================= 搭配引擎 ================= */
function colorPair(a,b){
  if(a===b) return NEUTRAL[a] ? 60 : 78;
  const an = !!NEUTRAL[a], bn = !!NEUTRAL[b];
  if(an && bn) return 72;
  if(an || bn) return 88;
  const d = Math.abs(HUE[a]-HUE[b]); const dd = Math.min(d,360-d);
  if(dd <= 30) return 82;
  if(dd >= 120) return 76;
  return 66;
}
function scoreOutfit(parts){
  let sc=0, pairs=0;
  for(let i=0;i<parts.length;i++) for(let j=i+1;j<parts.length;j++){ sc += colorPair(parts[i].color, parts[j].color); pairs++; }
  let base = pairs ? sc/pairs : 70;
  const cs = parts.map(p=>p.color);
  const loud = cs.filter(c=>!NEUTRAL[c] && c!=='棕').length;
  if(loud>=3) base -= 12;
  if(loud===0) base -= 4;
  return Math.max(0, Math.round(base));
}
function whyText(parts){
  const cols = [...new Set(parts.map(p=>p.color))];
  const colored = cols.filter(c=>!NEUTRAL[c]);
  const neutral = cols.filter(c=>NEUTRAL[c]);
  const bits = [];
  if(colored.length===0) bits.push('全中性色，稳妥不出错，靠版型和材质撑住');
  else if(neutral.length>=2) bits.push(neutral.slice(0,2).join('、')+'打底，'+colored[0]+'提气色');
  else if(neutral.length===1) bits.push(neutral[0]+'压住全身，'+colored.join('、')+'做重点');
  else bits.push(colored.join('＋')+'撞色，配饰别再加第三个亮色');
  const scenes = parts.reduce((a,p)=>a.concat(p.scene||[]),[]);
  const common = SCENES.filter(s=>scenes.filter(x=>x===s).length>=2)[0];
  if(common) bits.push('两边都够'+common);
  return bits.join('；')+'。';
}
function pickOutfits(opts){
  const o = opts || {};
  const season = o.season || curSeason || seasonByMonth();
  const owner = o.owner || DB.owner;
  let pool = DB.items.filter(it=> it.owner===owner && it.cat!=='待分类' && it.cat!=='睡衣'
    && (it.season||[]).includes(season));
  const tops = pool.filter(i=>i.cat==='上装');
  const bottoms = pool.filter(i=>i.cat==='下装');
  const dresses = pool.filter(i=>i.cat==='连衣裙');
  const shoes = pool.filter(i=>i.cat==='鞋');
  const outers = pool.filter(i=>i.cat==='外套');
  const bags = pool.filter(i=>i.cat==='包');
  const rnd = a => a[Math.floor(Math.random()*a.length)];
  const cands = [];
  if(tops.length && bottoms.length){
    for(const t of tops) for(const b of bottoms){
      const extra = [];
      if(shoes.length) extra.push(rnd(shoes));
      if((season==='冬'||season==='春秋') && outers.length && Math.random()<0.55) extra.push(rnd(outers));
      if(bags.length && Math.random()<0.4) extra.push(rnd(bags));
      cands.push([t,b,...extra]);
    }
  }
  for(const d of dresses){
    const extra = [];
    if(season!=='夏' && outers.length && Math.random()<0.5) extra.push(rnd(outers));
    if(shoes.length) extra.push(rnd(shoes));
    cands.push([d,...extra]);
  }
  let scored = cands.map(parts=>({parts, score:scoreOutfit(parts)}));
  if(o.mustId) scored = scored.filter(x=>x.parts.some(p=>p.id===o.mustId));
  scored.sort((a,b)=> (b.score-a.score) + (Math.random()-0.5)*2);
  const seen = new Set(), out = [];
  for(const x of scored){
    const key = x.parts.map(p=>p.id).join('|');
    const top = (x.parts.find(p=>p.cat==='上装'||p.cat==='连衣裙')||{}).id;
    if(seen.has(key) || (top&&seen.has('T'+top))) continue;
    seen.add(key); if(top) seen.add('T'+top);
    out.push(x); if(out.length>=3) break;
  }
  return out;
}

function renderWardrobe(){
  // 季节
  chipRow('fSeason', '季节', ['全部', ...SEASONS], view.season, v=>view.season=v);
  // 频率
  chipRow('fWear', '频率', ['全部', ...WEARS], view.wear, v=>view.wear=v);
  // 位置
  const locs = DB.locations.filter(l=>l.owner===undefined || l.owner===DB.owner || !l.owner);
  const locLabels = ['全部', '在外', ...locs.map(l=>locText(l))];
  const locBox = document.getElementById('fLoc'); locBox.innerHTML='';
  locLabels.forEach(v=>{

  });
  // 大类（7）
  const deptBox = document.getElementById('fDept');
  deptBox.innerHTML='';
  ['全部'].concat(DEPT7_NAMES).forEach(function(d){

    const b = el('button','chip'+(view.dept===d?' on':''), d + (n===null? '' : ' '+n));

    deptBox.appendChild(b);
  });
  // 品类（随大类收窄）
  const uncat = DB.items.filter(i=>i.owner===DB.owner && i.cat==='待分类').length;
  let catPool = CATS;
  if(view.dept && view.dept!=='全部') catPool = DEPTS7[view.dept] || CATS;
  const cats = ['全部', ...catPool].concat(uncat?['待分类']:[]);
  chipRow('fCat', '品类', cats, view.cat, v=>{ view.cat=v; view.sub='全部'; view.sleeve='全部'; view.mat='全部'; });
  // 款式
  const subBox = document.getElementById('fSub');

  if(view.cat!=='全部' && view.cat!=='待分类'){

      const b = el('button','chip'+(view.sub===s?' on':''), s);
      b.onclick = ()=>{ view.sub=s; renderWardrobe(); };
      subBox.appendChild(b);
    });
  }
  // 袖长
  const sleeveBox = document.getElementById('fSleeve');
  sleeveBox.innerHTML='';
  const showSleeve = SLEEVE_CATS.includes(view.cat);
  document.getElementById('sleeveRow').style.display = showSleeve ? '' : 'none';
  if(showSleeve){
    ['全部', ...SLEEVES].forEach(s=>{
      const b = el('button','chip'+(view.sleeve===s?' on':''), s);
      b.onclick = ()=>{ view.sleeve=s; renderWardrobe(); };
      sleeveBox.appendChild(b);
    });
  }

  // 材质
  const matBox = document.getElementById('fMat');
  matBox.innerHTML='';
  const mats = materialsFor(view.cat);
  document.getElementById('matRow').style.display = mats.length ? '' : 'none';
  if(mats.length){
    ['全部', ...mats].forEach(s=>{
      const b = el('button','chip'+(view.mat===s?' on':''), s);
      b.onclick = ()=>{ view.mat=s; renderWardrobe(); };
      matBox.appendChild(b);
    });
  }
  renderGrid();
}
function filteredItems(){
  let list = DB.items.filter(i=>i.owner===DB.owner);
  if(view.season!=='全部') list = list.filter(i=>(i.season||[]).includes(view.season));
  if(view.wear!=='全部') list = list.filter(i=>i.wear===view.wear);
  if(view.loc==='在外') list = list.filter(i=>!isStored(i));
  else if(view.loc!=='全部') list = list.filter(i=>{ const l=locOf(i); return l && locText(l)===view.loc; });
  if(view.dept && view.dept!=='全部') list = list.filter(i=>dept7Of(i.cat)===view.dept);
  if(view.cat!=='全部') list = list.filter(i=>i.cat===view.cat);
  if(view.sub!=='全部') list = list.filter(i=>i.sub===view.sub);
  if(view.sleeve!=='全部') list = list.filter(i=>i.sleeve===view.sleeve);
  if(view.mat!=='全部') list = list.filter(i=>i.material===view.mat);
  if(searchQ){
    const q = searchQ.toLowerCase();
    list = list.filter(i=>{
      const hay = [i.name,i.desc,i.sub,i.material,i.color,i.cat].filter(Boolean).join(' ').toLowerCase();
      return hay.indexOf(q) >= 0;
    });
  }
  return list;
}

/* ================= 渲染：新进待处理 ================= */
let cartRefresh = function(){ renderTable(); };
let pendingAll = false;
/* 缺什么：唯一判据，列表与红色标签共用 */
function missingOf(it){
  const m = [];
  if(!it.photo || it.photo === NO_PHOTO) m.push('缺照片');
  if(it.cat==='待分类'){ m.push('缺品类'); return m; }
  if(!(it.season||[]).length) m.push('缺季节');
  if(!(it.scene||[]).length) m.push('缺场合');
  if(!it.wear) m.push('缺频率');
  if(!it.locId) m.push('缺位置');
  return m;
}
function pendingLists(all){
  const mine = all ? DB.items.slice() : DB.items.filter(i=>i.owner===DB.owner);
  const noCat = mine.filter(i=>i.cat==='待分类');
  const noInfo = mine.filter(i=> i.cat!=='待分类' && missingOf(i).length > 0);
  return {noCat, noInfo};
}
function renderPending(){
  cartRefresh = renderPending;
  const wrap = document.getElementById('pendingWrap'); if(!wrap) return;
  wrap.innerHTML='';
  const hint = document.getElementById('pendingHint');

  // 入库清单
  const intakes = (DB.intakes||[]).filter(function(n){ return n.owner===DB.owner || pendingAll; }).slice(0,5);
  if(intakes.length){
    const bar = el('div','card');
    bar.style.cssText = 'padding:10px 14px;margin-bottom:12px;font-size:12.5px;color:var(--sub)';
    bar.innerHTML = '<b style="color:var(--ink)">最近入库</b>　' + intakes.map(function(n){
      const d = new Date(n.at);
      return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) + ' · ' + n.count + ' 件';
    }).join('　｜　');
    wrap.appendChild(bar);
  }
  const {noCat, noInfo} = pendingLists(pendingAll);
  const total = noCat.length + noInfo.length;
  const who = pendingAll ? '全部人' : ownerName(DB.owner);
  if(hint) hint.textContent = total
    ? who+' · 有 '+total+' 件还没处理完：没分类 '+noCat.length+' 件，资料不全 '+noInfo.length+' 件。'
    : who+' · 没有待处理的，都整理好了。';
  if(!total){
    wrap.appendChild(emptyCard('新进队列是空的','拍完照会自动落到这里，处理完就消失。'));
    syncBatchBar();
    return;
  }
  if(noCat.length){
    wrap.appendChild(cartBar(noCat));
    wrap.appendChild(buildCart('还没分类 · '+noCat.length+' 件', noCat));
  }
  if(noInfo.length){
    const sec = el('div','sec');
    sec.innerHTML = '<h2>资料不全</h2><span class="cnt warn">'+noInfo.length+'</span><span class="sp"></span>';
    wrap.appendChild(sec);

    wrap.appendChild(buildCart(null, noInfo));
  }
  syncBatchBar();
}

/* ================= 渲染：总表 ================= */
let tableMode = '全部';
function buildTable(title, list){
  const box = el('div');
  if(title){
    const h = el('div','tbl-title');
    h.innerHTML = '<h3>'+esc(title)+'</h3><span class="n">'+list.length+' 件</span>';
    box.appendChild(h);
  }
  const wrap = el('div','tablewrap');
  const tb = el('table','tb');
  const head = ['照片','编号','名称','品类','款式','袖长','材质','颜色','新旧','季节','场合','频率','位置','购入','淘汰','搭配','操作'];
  const tr0 = el('tr');
  head.forEach(x=>tr0.appendChild(el('th',null,x)));
  const thead = el('thead'); thead.appendChild(tr0); tb.appendChild(thead);
  const tbody = el('tbody');
  if(!list.length){
    const tr = el('tr');
    const td = el('td',null,'（这一类还没有衣服）');
    td.colSpan = head.length; td.style.color = '#9b9b9b'; td.style.padding = '16px';
    tr.appendChild(td); tbody.appendChild(tr);
  }
  list.forEach(it=>{
    const tr = el('tr', it.retiredAt? 'retired':'');
    const l = locOf(it);
    const cells = [
      '<img src="'+it.photo+'" alt="">',
      esc(it.no||''), esc(it.name), esc(it.cat), esc(it.sub), esc(it.sleeve), esc(it.material), esc(it.color), esc(it.cond||''),
      (it.season||[]).join('/'), (it.scene||[]).join('/'), esc(it.wear),
      l? esc(locText(l)) : '在外',
      esc(it.boughtAt), esc(it.retiredAt), esc(it.pair)
    ];
    cells.forEach((c,i)=>{
      const td = el('td');
      if(i===0) td.innerHTML = c;
      else { td.textContent = c; if(i===15||i===9||i===10) { td.className='cut'; td.title = c; } }
      tr.appendChild(td);
    });
    const tdAct = el('td');
    tdAct.style.whiteSpace = 'nowrap';
    const bCls = el('button','mini on','分类');
    bCls.style.cssText = 'padding:4px 10px;font-size:12px';
    bCls.onclick = function(ev){ if(ev) ev.stopPropagation(); openClassSheet([it.id]); };
    const bDel = el('button','mini','删除');
    bDel.style.cssText = 'padding:4px 10px;font-size:12px;margin-left:6px';
    bDel.onclick = function(ev){ if(ev) ev.stopPropagation(); armDelete(it, bDel); };
    tdAct.appendChild(bCls); tdAct.appendChild(bDel);
    tr.appendChild(tdAct);
    tr.style.cursor = 'pointer';
    tr.onclick = ()=> openItem(it.id);
    tbody.appendChild(tr);
  });
  tb.appendChild(tbody);
  wrap.appendChild(tb);
  box.appendChild(wrap);
  return box;
}
function renderTable(){
  cartRefresh = renderTable;
  const seg = document.getElementById('tableSeg');
  if(seg){
    seg.innerHTML='';
    ['全部','按品类','按季节','按场合'].forEach(mm=>{
      const b = el('button','chip'+(tableMode===mm?' on':''), mm);
      b.onclick = ()=>{ tableMode=mm; renderTable(); };
      seg.appendChild(b);
    });
    const sp = el('span'); sp.style.cssText='width:12px';
    seg.appendChild(sp);
    ['清单','表格'].forEach(st=>{
      const b = el('button','chip'+(tableStyle===st?' on':''), st);
      b.style.fontSize='13px';
      b.onclick = ()=>{ tableStyle=st; renderTable(); };
      seg.appendChild(b);
    });
  }
  const wrap = document.getElementById('tableWrap');
  if(!wrap) return;
  wrap.innerHTML='';
  const items = DB.items.filter(i=>i.owner===DB.owner);
  const hint = document.getElementById('tableHint');
  if(!items.length){
    wrap.appendChild(emptyCard('总表还是空的','先把衣服加进来，这张表会自动长出来。'));
    if(hint) hint.textContent='';
    return;
  }
  if(hint) hint.textContent = ownerName(DB.owner)+' · 共 '+items.length+' 件'
    + (tableMode==='全部'? ' · 勾选后可批量处理或删除' : ' · 按'+tableMode.replace('按','')+'拆开，每类可单独勾选处理');
  if(tableStyle==='表格'){
    if(tableMode==='全部'){ wrap.appendChild(buildTable(null, items)); return; }
    if(tableMode==='按品类'){
      CATS.forEach(c=>{
        const sub = items.filter(i=>i.cat===c);
        if(!sub.length) return;
        wrap.appendChild(buildTable(c, sub));
      });
      return;
    }
    if(tableMode==='按季节'){
      const used = SEASONS.filter(s=>items.some(i=>(i.season||[]).includes(s)));
      (used.length?used:SEASONS).forEach(s=>{
        wrap.appendChild(buildTable(s+'季', items.filter(i=>(i.season||[]).includes(s))));
      });
      return;
    }
    const usedSc = SCENES.filter(s=>items.some(i=>(i.scene||[]).includes(s)));
    (usedSc.length?usedSc:SCENES).forEach(s=>{
      wrap.appendChild(buildTable(s, items.filter(i=>(i.scene||[]).includes(s))));
    });
    return;
  }
  // 购物车式清单
  wrap.appendChild(cartBar(items));
  if(tableMode==='全部'){ wrap.appendChild(buildCart(null, items)); syncBatchBar(); return; }
  if(tableMode==='按品类'){
    CATS.forEach(c=>{
      const sub = items.filter(i=>i.cat===c);
      if(!sub.length) return;
      wrap.appendChild(buildCart(c, sub));
    });
    syncBatchBar();
    return;
  }
  if(tableMode==='按季节'){
    const used = SEASONS.filter(s=>items.some(i=>(i.season||[]).includes(s)));
    (used.length?used:SEASONS).forEach(s=>{
      wrap.appendChild(buildCart(s+'季', items.filter(i=>(i.season||[]).includes(s))));
    });
    syncBatchBar();
    return;
  }
  const usedSc = SCENES.filter(s=>items.some(i=>(i.scene||[]).includes(s)));
  (usedSc.length?usedSc:SCENES).forEach(s=>{
    wrap.appendChild(buildCart(s, items.filter(i=>(i.scene||[]).includes(s))));
  });
  syncBatchBar();
}

let tableStyle = '清单';
function cartBar(list){
  const bar = el('div','cartbar');
  const allOn = list.length && list.every(i=>sel.has(i.id));
  const bAll = el('button','mini'+(allOn?' on':''), allOn?'取消全选':'全选');
  bAll.onclick = ()=>{
    if(allOn) list.forEach(i=>sel.delete(i.id));
    else list.forEach(i=>sel.add(i.id));
    cartRefresh();
  };
  const cnt = el('span','sub','已选 '+sel.size+' 件');
  const bCls = el('button','mini on','批量分类');
  bCls.onclick = ()=>{ if(!sel.size){ toast('先勾选'); return; } openClassSheet(Array.from(sel)); };
  const bDel = el('button','mini','删除选中');
  bDel.onclick = function(){
    if(!sel.size){ toast('先勾选'); return; }
    deleteMany(Array.from(sel), bDel);
  };
  bar.appendChild(bAll); bar.appendChild(cnt); bar.appendChild(bCls); bar.appendChild(bDel);
  return bar;
}
function deleteMany(ids, btn){
  if(btn && btn.dataset.armed !== '1'){
    btn.dataset.armed='1'; btn._label = btn.textContent;
    btn.textContent = '再点一次删掉 '+ids.length+' 件';
    btn.style.background='#fbeee8'; btn.style.color='#b4552f'; btn.style.borderColor='#e8b9a6';
    setTimeout(function(){
      if(btn.dataset.armed==='1'){ btn.dataset.armed='0'; btn.textContent=btn._label;
        btn.style.background=''; btn.style.color=''; btn.style.borderColor=''; }
    }, 3500);
    return;
  }
  DB.items = DB.items.filter(i=>ids.indexOf(i.id) < 0);
  DB.saved = DB.saved.filter(s=>s.ids.every(id=>DB.items.some(x=>x.id===id)));
  ids.forEach(id=>sel.delete(id));
  save(); renderAll(); toast('已删除 '+ids.length+' 件');
}

      l? locText(l) : '在外', it.boughtAt? '购'+it.boughtAt : '', it.retiredAt? '淘汰'+it.retiredAt : ''
    ].filter(Boolean).join(' · ');

      + '<div class="cmeta">'+esc(line1||'还没填品类')+'</div>'
      + '<div class="cmeta">'+esc(line2)+'</div>'
      + (miss.length? '<div class="cmeta" style="margin-top:5px">'+miss.map(m=>'<span class="miss">'+m+'</span>').join('')+'</div>' : '')
      + (it.pair? '<div class="cmeta">搭配：'+esc(it.pair)+'</div>' : '');
    const act = el('div','cact');

}
function csvCell(v){
  const s = (v==null?'':String(v));
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

/* ================= 渲染：换季 ================= */
function renderSeasonPlan(){
  const wrap = document.getElementById('seasonWrap'); wrap.innerHTML='';
  const hint = document.getElementById('seasonHint');
  const list = DB.items.filter(i=>i.owner===DB.owner);
  if(!list.length){
    hint.textContent='';
    wrap.appendChild(emptyCard('衣橱还是空的','先加几件衣服，换季清单才有东西可算。'));
    return;
  }
  // 季节与箱子不一致的，先挑出来
  const CONFLICT = list.filter(function(it){
    if(!isStored(it)) return false;
    const l = locOf(it);
    const bs = boxSeasonOf(l);
    if(!bs) return false;
    return !(it.season||[]).length || it.season.indexOf(bs) < 0;
  });
  const conflicted = {};
  CONFLICT.forEach(function(it){ conflicted[it.id] = 1; });

  const takeOut = list.filter(i=>(i.season||[]).includes(curSeason) && isStored(i) && !conflicted[i.id]);
  const putAway = list.filter(i=>!(i.season||[]).includes(curSeason) && !isStored(i));
  hint.textContent = '下面按「' + curSeason + '」算：要拿出 ' + takeOut.length + ' 件，要收起 ' + putAway.length + ' 件'
    + (CONFLICT.length? '，另有 '+CONFLICT.length+' 件季节和箱子对不上，先处理它们。' : '。');

  // 什么时候换
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let nxt = null;
  [now.getFullYear(), now.getFullYear()+1].forEach(function(y){
    SWAPS.forEach(function(s){
      const dt = new Date(y, s.m-1, s.d);
      if(dt >= today && (!nxt || dt < nxt.dt)) nxt = {label:s.label, from:s.from, to:s.to, dt:dt};
    });
  });
  const info = el('div','card');
  info.style.cssText = 'padding:16px;margin-bottom:12px';
  let ih = '<div style="font-size:12px;color:var(--sub);letter-spacing:1px">换季时间</div>'
    + '<div style="font-size:17px;font-weight:700;margin-top:6px">现在是 <span style="color:var(--accent)">'
    + seasonByMonth() + '</span> 季（' + (now.getMonth()+1) + '月）</div>';
  if(nxt){
    const dd = Math.round((nxt.dt - today)/86400000);
    ih += '<div style="margin-top:8px;font-size:14px">下一次：<b>' + nxt.label + '</b>（'
      + (nxt.dt.getMonth()+1) + '月' + nxt.dt.getDate() + '日）· 还有 <b>' + dd + '</b> 天</div>'
      + '<div class="sub" style="margin-top:4px">那天要做：把「' + nxt.from + '」收起来，把「' + nxt.to + '」拿出来。</div>';
  }
  ih += '<table style="width:100%;font-size:13px;border-collapse:collapse;margin-top:12px">'
    + SWAPS.map(function(s){
        return '<tr><td style="padding:4px 0;color:var(--sub);width:90px">'+s.label+'</td><td>'+s.from+' → <b>'+s.to+'</b></td></tr>';
      }).join('')
    + '</table>'
    + '<div class="sub" style="margin-top:8px">北方提前两周、南方推后两三周；看连续一周最低温，不看日历。</div>';
  info.innerHTML = ih;
  wrap.appendChild(info);

  const storedText = (arr) => {
    const m = {};
    arr.forEach(function(i){
      const l = locOf(i);
      if(l && STORED_TYPES.includes(l.type)) m[locText(l)] = (m[locText(l)]||0)+1;
    });
    return Object.keys(m).sort().map(function(k){ return k+'（'+m[k]+'件）'; }).join('、');
  };

  const block = (title, arr, tip, extra) => {
    const sec = el('div','sec');
    sec.innerHTML = '<h2>'+title+'</h2><span class="cnt'+(arr.length?'':' zero')+'">'+arr.length+'</span><span class="sp"></span>';
    wrap.appendChild(sec);
    const p = el('div','hint'); p.style.margin='-4px 2px 10px'; p.textContent = tip;
    wrap.appendChild(p);
    if(extra){ const e2 = el('div','why'); e2.style.marginBottom='10px'; e2.innerHTML = extra; wrap.appendChild(e2); }
    if(!arr.length){ const c0 = el('div','card'); c0.appendChild(el('div','empty','这一步没有要动的')); wrap.appendChild(c0); return; }
    // 按位置分组
    const groups = {};
    arr.forEach(i=>{
      const l = locOf(i);
      const k = l ? locText(l) : '没归位';
      (groups[k]=groups[k]||[]).push(i);
    });
    Object.keys(groups).sort().forEach(k=>{
      const c = el('div','card'); c.style.marginBottom='12px'; c.style.overflow='hidden';
      const h = el('div');
      h.style.cssText='padding:10px 14px;background:#faf8f4;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center';
      h.innerHTML = '<b style="font-size:13.5px">'+esc(k)+'</b><span class="sub">'+groups[k].length+' 件</span>';
      c.appendChild(h);
      groups[k].forEach(it=>{
        const r = el('div','row');
        r.innerHTML = '<div class="th"><img src="'+it.photo+'" alt=""></div>'
          + '<div class="bd"><div class="t1">'+esc(it.name)+'</div>'
          + '<div class="t2">'+it.cat+(it.sub?' · '+it.sub:'')+' · '+(it.season||[]).join('/')+'</div></div>';
        r.onclick = ()=> openItem(it.id);
        c.appendChild(r);
      });
      wrap.appendChild(c);
    });
  };

  if(CONFLICT.length){
    const sec = el('div','sec');
    sec.innerHTML = '<h2>季节和箱子对不上</h2><span class="cnt warn">'+CONFLICT.length+'</span><span class="sp"></span>';
    wrap.appendChild(sec);
    wrap.appendChild(el('div','hint','东西收在「夏装」这类箱子里，季节标签却含这个季节；按箱子改一下，换季清单才准。'));
    const c = el('div','card'); c.style.marginBottom='12px'; c.style.overflow='hidden';
    CONFLICT.forEach(function(it){
      const l = locOf(it);
      const bs = boxSeasonOf(l);
      const r = el('div','row');
      r.innerHTML = '<div class="th"><img src="'+it.photo+'" alt=""></div>'
        + '<div class="bd"><div class="t1">'+esc(it.name)+'</div>'
        + '<div class="t2">现在标的是「'+(it.season||[]).join('/')+'」，箱子是「'+esc(locText(l))+'」</div></div>';
      const b = el('button','mini on','改成'+bs+'季');
      b.onclick = function(){
        it.season = [bs];
        save(); renderSeasonPlan(); renderPending(); toast('已改成'+bs+'季');
      };
      r.appendChild(b);
      c.appendChild(r);
    });
    wrap.appendChild(c);
  }

  block('该拿出来', takeOut, '这些是'+curSeason+'季能穿的，现在还收在箱/柜/盒里。',
    takeOut.length? '<b>要开：</b>'+(storedText(takeOut)||'（没有收在箱柜里的）') : '');
  block('该收起来', putAway, '这些不是'+curSeason+'季穿的，现在还在外面，收进箱/柜/盒。',
    putAway.length? '<b>要收进：</b>'+(storedText(putAway)||'还没有合适的位置，先在「清单」里建一只箱') : '');
}

function renderLists(){ renderListGroups(); renderStock(); renderAudit(); renderUnworn(); renderGaps(); renderLocs(); }

/* 清单的分法：按季节 / 按频率 / 按换季逻辑 */
let listMode = '按季节';
function renderListGroups(){
  const chips = document.getElementById('listModeChips');
  if(!chips) return;
  chips.innerHTML='';
  ['按季节','按频率','按换季'].forEach(function(m){
    const b = el('button','chip'+(listMode===m?' on':''), m);
    b.onclick = function(){ listMode=m; renderListGroups(); };
    chips.appendChild(b);
  });
  const wrap = document.getElementById('listGroups');
  if(!wrap) return;
  wrap.innerHTML='';
  const mine = DB.items.filter(function(i){ return i.owner===DB.owner && !i.retiredAt; });
  if(!mine.length){ wrap.appendChild(el('div','hint','这个衣橱还没有东西。')); return; }

  const renderGroup = function(title, items){
    const c = el('div','card'); c.style.marginBottom='10px'; c.style.overflow='hidden';
    const h = el('div');
    h.style.cssText='padding:9px 14px;background:#faf8f4;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center';
    h.innerHTML = '<b style="font-size:13px">'+esc(title)+'</b><span class="sub">'+items.length+' 件</span>';
    c.appendChild(h);
    items.slice(0,6).forEach(function(it){
      const l = locOf(it);
      const r = el('div','row');
      r.innerHTML = '<div class="th"><img src="'+it.photo+'" alt=""></div>'
        + '<div class="bd"><div class="t1">'+esc(it.no||'')+' '+esc(it.name)+'</div>'
        + '<div class="t2">'+esc([it.cat,it.sub,it.cond].filter(Boolean).join(' · '))
        + (l? ' · 在 '+esc(locText(l)) : ' · 在外')+'</div></div>';
      r.onclick = function(){ openItem(it.id); };
      c.appendChild(r);
    });
    if(items.length>6){
      const more = el('div','hint','还有 '+(items.length-6)+' 件，去「衣橱」按条件筛');
      more.style.margin='6px 14px 10px';
      c.appendChild(more);
    }
    wrap.appendChild(c);
  };

  if(listMode==='按季节'){
    SEASONS.forEach(function(s){
      renderGroup(s+'季', mine.filter(function(i){ return (i.season||[]).indexOf(s)>=0; }));
    });
    const none = mine.filter(function(i){ return !(i.season||[]).length; });
    if(none.length) renderGroup('还没标季节', none);
    return;
  }
  if(listMode==='按频率'){
    WEARS.forEach(function(w){
      renderGroup(w, mine.filter(function(i){ return i.wear===w; }));
    });
    const none = mine.filter(function(i){ return !i.wear; });
    if(none.length) renderGroup('还没标频率', none);
    return;
  }
  // 按换季逻辑
  const s = curSeason;
  const takeOut = mine.filter(function(i){ return (i.season||[]).indexOf(s)>=0 && isStored(i); });
  const putAway = mine.filter(function(i){ return (i.season||[]).indexOf(s)<0 && !isStored(i); });
  const stay = mine.filter(function(i){ return (i.season||[]).indexOf(s)>=0 && !isStored(i); });
  renderGroup('本季已在外面（'+s+'）', stay);
  renderGroup('该拿出来（'+s+'，收在箱里）', takeOut);
  renderGroup('该收起来（不是'+s+'季，还在外面）', putAway);
}

/* 盘点：逐件核一遍，找不到的单独列出来 */
function renderStock(){

  const last = DB.stockAt ? new Date(DB.stockAt).toLocaleDateString('zh-CN') : '从来没盘过';
  const days = DB.stockAt ? Math.floor((Date.now()-DB.stockAt)/86400000) : null;
  const due = (days===null) || days >= 90;
  const line = el('div','hint');
  line.style.margin = '0 2px 10px';
  if(due) line.style.color = '#b4552f';
  line.textContent = (due? '该盘点了（季度一次）· ' : '')
    + '上次盘点：' + last + (days!==null? '（'+days+' 天前）' : '')
    + (missed.length? '；有 '+missed.length+' 件当时没找到' : '');
  wrap.appendChild(line);

  const c = el('div','card'); c.style.overflow='hidden';

  c.appendChild(h);

    const l = locOf(it);
    const r = el('div','row');
    r.innerHTML = '<div class="th"><img src="'+it.photo+'" alt=""></div>'
      + '<div class="bd"><div class="t1">'+esc(it.no||'')+' '+esc(it.name)+'</div>'
      + '<div class="t2">'+(l?'应该在 '+esc(locText(l)):'没归位')+'</div></div>';
    const b = el('button','mini','找到并清标记');
    b.onclick = function(ev){ ev.stopPropagation(); it.missedAt=''; save(); renderStock(); toast('已清标记'); };
    r.appendChild(b);
    r.onclick = function(){ openItem(it.id); };
    c.appendChild(r);
  });

}
function openStocktake(){
  if(!DB.items.filter(function(i){ return i.owner===DB.owner && !i.retiredAt; }).length){
    toast('这个衣橱还没有东西，没什么可盘的'); return;
  }
  let scope = '全部';
  const chosen = {};   // id -> 找到了吗（默认 true）
  const draw = function(){
    sheet.innerHTML=''; sheetHead('盘点 · 逐件核对');
    const tip = el('div','hint');
    tip.textContent = '默认都算「在」。找不到的那件，点一下取消勾选，保存后会单独列出来。';
    sheet.appendChild(tip);
    const chips = el('div','chips');
    ['全部'].concat(DB.locations.filter(function(l){ return !l.owner || l.owner===DB.owner; }).map(function(l){ return locText(l); })).forEach(function(k){
      const b = el('button','chip'+(scope===k?' on':''), k);
      b.onclick = function(){ scope=k; draw(); };
      chips.appendChild(b);
    });
    sheet.appendChild(chips);

    const list = DB.items.filter(function(i){
      if(i.owner!==DB.owner || i.retiredAt) return false;
      if(scope==='全部') return true;
      const l = locOf(i);
      return l && locText(l)===scope;
    });
    const card = el('div','card');
    card.style.marginTop='12px'; card.style.overflow='hidden';
    list.forEach(function(it){
      if(chosen[it.id] === undefined) chosen[it.id] = true;
      const on = chosen[it.id];
      const r = el('div','row');
      const cb = el('div','cbox'+(on?' on':''), on?'✓':'');
      cb.onclick = function(ev){ ev.stopPropagation(); chosen[it.id]=!on; draw(); };
      const th = el('div','th'); const img = el('img'); img.src = it.photo; th.appendChild(img);
      const bd = el('div','bd');
      const l = locOf(it);
      bd.innerHTML = '<div class="t1">'+esc(it.no||'')+' '+esc(it.name)+'</div>'
        + '<div class="t2">'+esc([it.cat,it.sub,it.color].filter(Boolean).join(' · '))+(l?' · '+esc(locText(l)):' · 在外')+'</div>';
      r.appendChild(cb); r.appendChild(th); r.appendChild(bd);
      card.appendChild(r);
    });
    sheet.appendChild(card);

    const gone = Object.keys(chosen).filter(function(k){ return chosen[k]===false; }).length;
    const cta = el('button','cta','保存盘点（共 '+list.length+' 件'+(gone? '，'+gone+' 件没找到':'')+'）');
    cta.onclick = function(){
      const now = Date.now();
      DB.items.forEach(function(i){
        if(i.owner!==DB.owner || i.retiredAt) return;
        if(chosen[i.id] === undefined) return;
        i.missedAt = chosen[i.id] ? '' : now;
      });
      DB.stockAt = now;
      save(); closeSheet(); renderLists(); toast('盘点完成');
    };
    sheet.appendChild(cta);
    mask.classList.add('on');
  };
  draw();
}
document.getElementById('btnStock').onclick = openStocktake;

/* 重复与过期：同类扎堆、计划淘汰日已过 */
function auditData(){
  const mine = DB.items.filter(i=>i.owner===DB.owner && !i.retiredAt);
  const map = {};
  mine.forEach(function(i){
    const k = i.cat + '|' + (i.sub||'');
    (map[k] = map[k] || []).push(i);
  });
  const groups = Object.keys(map)
    .map(function(k){ return {label: k.split('|').filter(Boolean).join(' · '), items: map[k]}; })
    .filter(function(g){ return g.items.length >= 3; })
    .sort(function(a,b){ return b.items.length - a.items.length; });
  const today = new Date().toISOString().slice(0,7);
  const overdue = mine.filter(function(i){ return i.retirePlan && i.retirePlan <= today; });
  return {groups, overdue};
}

/* 删除：点一次变红，再点一次才删；不用浏览器弹窗 */
function armDelete(it, btn){
  if(!btn) return;
  if(btn.dataset.armed === '1'){
    DB.items = DB.items.filter(x=>x.id!==it.id);
    DB.saved = DB.saved.filter(s=>s.ids.every(id=>DB.items.some(x=>x.id===id)));
    save(); closeSheet(); renderAll(); toast('已删除 · '+it.name);
    return;
  }
  btn.dataset.armed = '1';
  btn._label = btn.textContent;
  btn.textContent = '再点一次删除';
  btn.style.background = '#fbeee8';
  btn.style.borderColor = '#e8b9a6';
  btn.style.color = '#b4552f';
  setTimeout(function(){
    if(btn && btn.dataset.armed==='1' && btn._label){
      btn.dataset.armed='0'; btn.textContent = btn._label;
      btn.style.background=''; btn.style.borderColor=''; btn.style.color='';
    }
  }, 3500);
}

function openLocForm(cb, edit){
  const l = edit || {id:uid('l'), type:'箱', code:'', detail:'', owner:'', note:''};
  let type = l.type || '箱';
  let code = l.code || '';
  let detail = l.detail || '';

    sheet.innerHTML=''; sheetHead(edit?'编辑位置':'新建位置');
    const f1 = el('div','field');
    f1.appendChild(el('div','lab','是哪一种'));
    const c1 = el('div','chips');
    LOC_TYPES.forEach(t=>{
      const b = el('button','chip'+(type===t?' on':''), LOC_LABEL[t]);
      b.onclick = ()=>{ type=t; code=''; detail=''; draw(); };
      c1.appendChild(b);
    });
    f1.appendChild(c1); sheet.appendChild(f1);

    const f2 = el('div','field');
    const codeLab = type==='箱' ? '箱子编号（B01…）'
                  : type==='盒' ? '盒子编号（H01…）'
                  : type==='抽' ? '抽屉柜编号（D1…）' : '短衣柜编号（G1…）';
    f2.appendChild(el('div','lab', codeLab));
    const ip = el('input'); ip.type='text'; ip.value = code;
    ip.placeholder = type==='箱' ? 'B01' : type==='盒' ? 'H01' : type==='抽' ? 'D1' : 'G1';
    ip.oninput = e=> code = e.target.value;
    f2.appendChild(ip); sheet.appendChild(f2);

    const f3 = el('div','field');
    if(type==='抽'){
      f3.appendChild(el('div','lab','第几屉'));
      const c3 = el('div','chips');
      ['1','2','3','4','5','6'].forEach(n=>{
        const k = n+'屉';
        const b = el('button','chip'+(detail===k?' on':''), k);
        b.onclick = ()=>{ detail = detail===k?'':k; draw(); };
        c3.appendChild(b);
      });
      f3.appendChild(c3);
    }else if(type==='柜'){
      f3.appendChild(el('div','lab','挂在哪一区'));
      const c4 = el('div','chips');
      ['挂杆','上层','下层','顶层','抽屉'].forEach(k=>{
        const b = el('button','chip'+(detail===k?' on':''), k);
        b.onclick = ()=>{ detail = detail===k?'':k; draw(); };
        c4.appendChild(b);
      });
      f3.appendChild(c4);

/* ================= 拍照 / 批量入库 ================= */
function pendingCount(){ return DB.items.filter(i=>i.cat==='待分类' && i.owner===DB.owner).length; }
function nextUncatName(){ return '待分类 ' + (pendingCount()+1); }
function quickMsg(title, sub){
  const qb = document.getElementById('quickbar');
  if(qb) qb.classList.add('on');
  const m = document.getElementById('quickMsg');
  if(m) m.innerHTML = title + (sub? '<small>'+sub+'</small>' : '');
}
function pushItem(dataURL, col, preset){
  const p = preset || {};
  const cat = p.cat || '待分类';
  const obj = {
    id: uid(), photo: dataURL,
    name: cat==='待分类' ? nextUncatName() : ((col&&col.name)||'') + (p.sub || cat),
    owner: DB.owner, no: nextNo(DB.owner),
    cat: cat, sub: p.sub||'', sleeve: p.sleeve||'', material: p.material||'', desc: '',
    cond: p.cond||'',
    color: (col&&col.name)||'灰', hex: (col&&col.hex)||'#9b9b9b',
    season: (p.season||[]).slice(), scene: (p.scene||[]).slice(),
    wear: p.wear||'', reason:'', locId: p.locId||'', status:'在穿', createdAt: Date.now()
  };
  DB.items.unshift(obj);
  return obj;
}
function goPending(){ view.cat='待分类'; view.season='全部'; view.wear='全部'; view.loc='全部'; showTab('wardrobe'); }
async function importFiles(files){
  const arr = Array.prototype.slice.call(files||[]).filter(f=> !f.type || /^image\//.test(f.type));
  if(!arr.length){ quickMsg('拖进来的不是图片','支持 jpg / png / webp'); return; }
  let ok=0, bad=0;
  for(let i=0;i<arr.length;i++){
    quickMsg('正在处理 '+(i+1)+'/'+arr.length+'…','');
    try{
      const r = await compress(arr[i]);
      pushItem(r.dataURL, dominantColor(r.img));
      document.getElementById('quickThumb').src = r.dataURL;
      ok++;
    }catch(e){ bad++; console.warn('读图失败', e); }
  }
  try{ save(); }catch(e){}
  if(ok){
    DB.intakes = DB.intakes || [];
    DB.intakes.unshift({ id: uid('n'), at: Date.now(), owner: DB.owner, count: ok });
    DB.intakes = DB.intakes.slice(0, 30);
    save();
  }
  quickMsg('入库 <b>'+ok+'</b> 件'+(bad?'，<b>'+bad+'</b> 张没读进来':''), '共 '+pendingCount()+' 件待分类，点开补品类');
  renderAll();
  if(ok){ toast('已入库 '+ok+' 件'); goPending(); }
  else toast('一张也没读进来，换个格式试试');
}
function collectFiles(dt){
  const out = [];
  if(!dt) return out;
  if(dt.files && dt.files.length){ for(let i=0;i<dt.files.length;i++) out.push(dt.files[i]); }
  else if(dt.items && dt.items.length){
    for(let i=0;i<dt.items.length;i++){
      const it = dt.items[i];
      if(it && it.kind==='file' && it.getAsFile){ const f=it.getAsFile(); if(f) out.push(f); }
    }
  }
  return out;
}
function importFromUrl(url){
  quickMsg('正在读这张图…','');
  const img = new Image();
  img.crossOrigin='anonymous';
  img.onload = ()=>{
    try{
      const sc = Math.min(1, 760/Math.max(img.width,img.height));
      const w = Math.round(img.width*sc), h = Math.round(img.height*sc);
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      const dataURL = c.toDataURL('image/jpeg',0.68);
      pushItem(dataURL, dominantColor(img));
      save();
      document.getElementById('quickThumb').src = dataURL;
      quickMsg('入库 <b>1</b> 件','共 '+pendingCount()+' 件待分类');
      renderAll(); goPending();
    }catch(err){ quickMsg('这张图网页读不到','请先「图片另存为」，再把文件拖进来'); }
  };
  img.onerror = ()=> quickMsg('这张图读不到','请先「图片另存为」，再把文件拖进来');
  img.src = url;
}
let dragDepth = 0;
function dropHint(on){
  const dz = document.getElementById('dropzone');
  if(dz) dz.classList.toggle('on', on);
}
['dragenter','dragover'].forEach(ev=>{
  window.addEventListener(ev, e=>{
    e.preventDefault();
    if(ev==='dragenter') dragDepth++;
    if(e.dataTransfer) e.dataTransfer.dropEffect='copy';
    dropHint(true);
  });
});
window.addEventListener('dragleave', e=>{
  e.preventDefault();
  dragDepth = Math.max(0, dragDepth-1);
  if(dragDepth===0) dropHint(false);
});
window.addEventListener('drop', e=>{
  e.preventDefault();
  dragDepth=0; dropHint(false);
  const files = collectFiles(e.dataTransfer);
  if(files.length){ importFiles(files); return; }
  quickMsg('没读到图片','从微信直接拖的，先「另存为」或存到相册再试');
});

  const n = sel.size;
  DB.items = DB.items.filter(i=>!sel.has(i.id));
  DB.saved = DB.saved.filter(s=>s.ids.every(id=>DB.items.some(x=>x.id===id)));
  save(); exitSelect(); renderAll(); toast('已删除 '+n+' 件');
};

/* 批量处理：品类/款式/季节/场合/频率/位置 一次设完 */
function openClassSheet(ids, after){
  const st = {cat:null, sub:null, material:null, cond:null, season:null, scene:null, wear:null, locId:null, locSet:false,
              retire:null, retireReason:''};
  const draw = ()=>{
    sheet.innerHTML=''; sheetHead('批量处理 · '+ids.length+' 件');
    sheet.appendChild(el('div','hint','只改你点过的项，没点的保持原样。'));

    // 品类
    const f1 = el('div','field');
    f1.appendChild(el('div','lab','品类'));
    const row = el('div','chips');
    const bNone = el('button','chip'+(st.cat===null?' on':''), '不改');
    bNone.onclick = ()=>{ st.cat=null; st.sub=null; draw(); };
    row.appendChild(bNone);
    CATS.forEach(c=>{
      const b = el('button','chip'+(st.cat===c?' on':''), c);
      b.onclick = ()=>{ st.cat=c; st.sub=null; draw(); };
      row.appendChild(b);
    });
    f1.appendChild(row); sheet.appendChild(f1);

    if(st.cat){
      const subs = SUBCATS[st.cat]||[];
      if(subs.length){
        const f2 = el('div','field');
        f2.appendChild(el('div','lab','款式'));
        const c2 = el('div','chips');
        const b0 = el('button','chip'+(st.sub===null?' on':''), '不限');
        b0.onclick = ()=>{ st.sub=null; draw(); };
        c2.appendChild(b0);
        subs.forEach(s=>{
          const b = el('button','chip'+(st.sub===s?' on':''), s);
          b.onclick = ()=>{ st.sub = st.sub===s?null:s; draw(); };
          c2.appendChild(b);
        });
        f2.appendChild(c2); sheet.appendChild(f2);
      }
    }

    // 材质
    const mats = materialsFor(st.cat || (DB.items.find(i=>ids.indexOf(i.id)>=0)||{}).cat || '上装');
    const f2b = el('div','field');
    f2b.appendChild(el('div','lab','材质'));
    const c2b = el('div','chips');
    const b2b = el('button','chip'+(st.material===null?' on':''), '不改');
    b2b.onclick = ()=>{ st.material=null; draw(); };
    c2b.appendChild(b2b);
    mats.forEach(m=>{
      const b = el('button','chip'+(st.material===m?' on':''), m);
      b.onclick = ()=>{ st.material = st.material===m?null:m; draw(); };
      c2b.appendChild(b);
    });
    f2b.appendChild(c2b); sheet.appendChild(f2b);

    // 新旧
    const f2c = el('div','field');
    f2c.appendChild(el('div','lab','新旧'));
    const c2c = el('div','chips');
    const b2c = el('button','chip'+(st.cond===null?' on':''), '不改');
    b2c.onclick = ()=>{ st.cond=null; draw(); };
    c2c.appendChild(b2c);
    CONDS.forEach(function(k){
      const b = el('button','chip'+(st.cond===k?' on':''), k);
      b.onclick = ()=>{ st.cond = st.cond===k?null:k; draw(); };
      c2c.appendChild(b);
    });
    f2c.appendChild(c2c); sheet.appendChild(f2c);

    // 季节（多选）
    const f3 = el('div','field');
    f3.appendChild(el('div','lab','季节（多选，点了才会改）'));
    const c3 = el('div','chips');
    const b3 = el('button','chip'+(st.season===null?' on':''), '不改');
    b3.onclick = ()=>{ st.season=null; draw(); };
    c3.appendChild(b3);
    SEASONS.forEach(s=>{
      const on = st.season && st.season.includes(s);
      const b = el('button','chip'+(on?' on':''), s);
      b.onclick = ()=>{
        const cur = st.season || [];
        const nx = on ? cur.filter(x=>x!==s) : cur.concat(s);
        st.season = nx.length ? nx : null;
        draw();
      };
      c3.appendChild(b);
    });
    f3.appendChild(c3); sheet.appendChild(f3);

    // 场合（多选）
    const f4 = el('div','field');
    f4.appendChild(el('div','lab','场合（多选，点了才会改）'));
    const c4 = el('div','chips');
    const b4 = el('button','chip'+(st.scene===null?' on':''), '不改');
    b4.onclick = ()=>{ st.scene=null; draw(); };
    c4.appendChild(b4);
    SCENES.forEach(s=>{
      const on = st.scene && st.scene.includes(s);
      const b = el('button','chip'+(on?' on':''), s);
      b.onclick = ()=>{
        const cur = st.scene || [];
        const nx = on ? cur.filter(x=>x!==s) : cur.concat(s);
        st.scene = nx.length ? nx : null;
        draw();
      };
      c4.appendChild(b);
    });
    f4.appendChild(c4); sheet.appendChild(f4);

    // 频率
    const f5 = el('div','field');
    f5.appendChild(el('div','lab','穿得勤吗'));
    const c5 = el('div','chips');
    const b5 = el('button','chip'+(st.wear===null?' on':''), '不改');
    b5.onclick = ()=>{ st.wear=null; draw(); };
    c5.appendChild(b5);
    WEARS.forEach(w=>{
      const b = el('button','chip'+(st.wear===w?' on':''), w);
      b.onclick = ()=>{ st.wear = st.wear===w?null:w; draw(); };
      c5.appendChild(b);
    });
    f5.appendChild(c5); sheet.appendChild(f5);

    // 位置
    const f6 = el('div','field');
    f6.appendChild(el('div','lab','存放位置'));
    const c6 = el('div','chips');
    const b6 = el('button','chip'+(st.locSet===false?' on':''), '不改');
    b6.onclick = ()=>{ st.locSet=false; st.locId=null; draw(); };
    c6.appendChild(b6);
    const bOut = el('button','chip'+(st.locSet && st.locId===''?' on':''), '在外');
    bOut.onclick = ()=>{ st.locSet=true; st.locId=''; draw(); };
    c6.appendChild(bOut);
    DB.locations.filter(l=>!l.owner || l.owner===DB.owner).forEach(l=>{
      const b = el('button','chip'+(st.locSet && st.locId===l.id?' on':''), locText(l));
      b.onclick = ()=>{ st.locSet=true; st.locId=l.id; draw(); };
      c6.appendChild(b);
    });
    const bNl = el('button','chip','＋ 新位置');
    bNl.onclick = ()=> openLocForm(nl=>{ st.locSet=true; st.locId=nl.id; draw(); });
    c6.appendChild(bNl);
    f6.appendChild(c6); sheet.appendChild(f6);

    // 是否淘汰
    const f7 = el('div','field');
    f7.appendChild(el('div','lab','是否淘汰'));
    const c7 = el('div','chips');
    const b7a = el('button','chip'+(st.retire===null?' on':''), '不改');
    b7a.onclick = ()=>{ st.retire=null; draw(); };
    c7.appendChild(b7a);
    const b7b = el('button','chip'+(st.retire==='keep'?' on':''), '继续用');
    b7b.onclick = ()=>{ st.retire='keep'; draw(); };
    c7.appendChild(b7b);
    const b7c = el('button','chip'+(st.retire==='retire'?' on':''), '淘汰');
    b7c.onclick = ()=>{ st.retire='retire'; draw(); };
    c7.appendChild(b7c);
    f7.appendChild(c7);
    if(st.retire==='retire'){
      const lab7 = el('div','lab','淘汰原因'); lab7.style.marginTop='12px';
      f7.appendChild(lab7);
      const c7b = el('div','chips');
      ['起球','褪色','不合身','不喜欢','穿旧了','送人'].forEach(k=>{
        const b = el('button','chip'+(st.retireReason===k?' on':''), k);
        b.onclick = ()=>{ st.retireReason = st.retireReason===k?'':k; draw(); };
        c7b.appendChild(b);
      });
      f7.appendChild(c7b);
    }
    sheet.appendChild(f7);

    // 摘要
    const parts = [];
    if(st.cat) parts.push('品类='+st.cat+(st.sub?'·'+st.sub:''));
    if(st.material) parts.push('材质='+st.material);
    if(st.cond) parts.push('新旧='+st.cond);
    if(st.season) parts.push('季节='+st.season.join('/'));
    if(st.scene) parts.push('场合='+st.scene.join('/'));
    if(st.wear) parts.push('频率='+st.wear);
    if(st.locSet) parts.push('位置='+(st.locId? locText(DB.locations.find(x=>x.id===st.locId)||{}) : '在外'));
    if(st.retire) parts.push(st.retire==='retire' ? '淘汰'+(st.retireReason?'（'+st.retireReason+'）':'') : '继续用');
    const missing = [];
    if(!st.cat) missing.push('品类');
    if(!st.season) missing.push('季节');
    if(!st.scene) missing.push('场合');
    if(!st.wear) missing.push('频率');
    if(!st.locSet) missing.push('位置');
    const cta = el('button','cta', missing.length
      ? '还差：' + missing.join('、')
      : '保存 · 改这 '+ids.length+' 件（'+parts.join('，')+'）');
    cta.disabled = missing.length > 0;
    cta.onclick = ()=>{
      const isHome = st.cat==='床品';
      DB.items.forEach(it=>{
        if(ids.indexOf(it.id) < 0) return;
        if(st.cat){
          it.cat = st.cat;
          if(st.sub !== null) it.sub = st.sub;
          else if(it.sub && (SUBCATS[st.cat]||[]).indexOf(it.sub) < 0) it.sub = '';
          if(/^待分类/.test(it.name) || !it.name) it.name = (it.color||'') + (it.sub||st.cat);
        }
        if(st.season) it.season = st.season.slice();
        if(st.scene) it.scene = st.scene.slice();
        if(st.material) it.material = st.material;
        if(st.cond) it.cond = st.cond;
        if(st.retire==='retire'){
          it.retiredAt = it.retiredAt || new Date().toISOString().slice(0,7);
          it.retireReason = st.retireReason || it.retireReason || '';
        }else if(st.retire==='keep'){
          it.retiredAt = ''; it.retireReason = '';
        }
        if(st.wear){ it.wear = st.wear; if(st.wear==='常穿') it.reason=''; else if(!it.reason) it.reason = REASONS[0]; }
        if(st.locSet) it.locId = st.locId || '';
        if(isHome) it.scene = ['家居'];
      });
      save(); closeSheet(); renderAll();
      toast('已处理 '+ids.length+' 件');
      if(after) after();
    };
    sheet.appendChild(cta);
    const cancel = el('button','cta danger','取消');
    cancel.style.marginTop='10px';
    cancel.onclick = ()=>{ closeSheet(); if(after) after(); };
    sheet.appendChild(cancel);
    mask.classList.add('on');
  };
  draw();
}

/* 查重：同一张照片进了多次 */
function findDupes(){
  const m = {};
  DB.items.filter(i=>i.owner===DB.owner).forEach(i=>{
    const k = (i.photo||'').slice(-600);
    (m[k] = m[k] || []).push(i);
  });
  return Object.keys(m).filter(k=>m[k].length>1).map(k=>m[k]);
}
function openDupes(){
  const groups = findDupes();
  sheet.innerHTML=''; sheetHead('重复的照片');
  if(!groups.length){
    sheet.appendChild(el('div','empty','没发现重复：每张照片只进来了一次。'));
    mask.classList.add('on'); return;
  }
  sheet.appendChild(el('div','why','下面每组是同一张照片进了多次。删掉多余的，留一张就行。'));
  groups.forEach(g=>{
    const c = el('div','card'); c.style.marginTop='12px'; c.style.overflow='hidden';
    g.forEach((it,idx)=>{
      const r = el('div','row');
      r.innerHTML = '<div class="th"><img src="'+it.photo+'" alt=""></div>'
        + '<div class="bd"><div class="t1">'+esc(it.name)+'</div>'
        + '<div class="t2">'+esc(it.cat)+' · '+new Date(it.createdAt||Date.now()).toLocaleString('zh-CN')+'</div></div>';
      if(idx===0){
        r.appendChild(el('span','sub','保留'));
      }else{
        const b = el('button','mini','删这件');
        b.onclick = ()=>{
          DB.items = DB.items.filter(x=>x.id!==it.id);
          save(); closeSheet(); renderAll(); toast('已删除 1 件');
        };
        r.appendChild(b);
      }
      c.appendChild(r);
    });
    const keep = el('button','mini on','只留第一张，删掉其余 '+(g.length-1)+' 张');
    keep.style.margin='10px 14px 14px';
    keep.onclick = ()=>{
      const keepId = g[0].id;
      DB.items = DB.items.filter(x=> x.id===keepId || !g.some(y=>y.id===x.id));
      save(); closeSheet(); renderAll(); toast('已清掉 '+(g.length-1)+' 张重复');
    };
    c.appendChild(keep);
    sheet.appendChild(c);
  });
  mask.classList.add('on');
}
