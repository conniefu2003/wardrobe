/* ================= 查找 ================= */
function findMatch(it, q){
  const hay = [it.no, it.name, it.cat, it.sub, it.sleeve, it.material, it.color, it.desc, it.pair, it.cond,
    (it.season||[]).join(''), (it.scene||[]).join('')].filter(Boolean).join(' ').toLowerCase();
  return hay.indexOf(q.toLowerCase()) >= 0;
}
function openFind(){
  sheet.innerHTML=''; sheetHead('查找');
  const f = el('div','field');
  f.appendChild(el('div','lab','搜名字 / 品类 / 材质 / 颜色 / 编号'));
  const ip = el('input'); ip.type='search'; ip.placeholder='睡衣 · 鞋 · 真丝 · CO-005';
  f.appendChild(ip); sheet.appendChild(f);

  const quick = el('div','chips');
  ['睡衣','鞋','包','围巾','帽子','腰带','床品','外套','T恤','真丝'].forEach(k=>{
    const b = el('button','chip', k);
    b.style.fontSize='13px'; b.style.padding='4px 12px';
    b.onclick = ()=>{ ip.value = k; run(k); };
    quick.appendChild(b);
  });
  sheet.appendChild(quick);

  const out = el('div'); sheet.appendChild(out);

  function run(q){
    out.innerHTML='';
    const kw = (q||'').trim();
    const all = DB.items.slice();
    const list = kw ? all.filter(i=>findMatch(i, kw)) : [];
    if(!kw){
      out.appendChild(el('div','hint','输入关键词，或点上面的常用品类。结果会告诉你：有多少件、分别放在哪。'));
      return;
    }
    if(!list.length){
      const miss = el('div');
      miss.appendChild(el('div','hint','没找到「'+kw+'」。换个词试试，或者——家里确实没有，那就是该买的。'));
      const bGap = el('button','mini on','记进「缺的那一件」：'+kw);
      bGap.onclick = function(){
        DB.gaps = DB.gaps || [];
        DB.gaps.push({id:uid('g'), name:kw, scene:'', why:'搜索没找到，可能该补一件', done:false, owner:DB.owner});
        save(); toast('已记进缺件清单');
        bGap.textContent = '已记下'; bGap.disabled = true;
      };
      miss.appendChild(bGap);
      out.appendChild(miss);
      return;
    }
    // 按位置汇总
    const byLoc = {};
    list.forEach(it=>{
      const l = locOf(it);
      const k = l ? locText(l) : '在外（没归位）';
      byLoc[k] = (byLoc[k]||0)+1;
    });
    const sum = el('div','why');
    sum.style.margin='12px 0';
    sum.innerHTML = '<b>「'+esc(kw)+'」共 '+list.length+' 件</b><br>'
      + Object.keys(byLoc).sort().map(k=>esc(k)+'：'+byLoc[k]+' 件').join(' ｜ ');
    out.appendChild(sum);

    const c = el('div','card'); c.style.overflow='hidden';
    list.sort((a,b)=>{
      const la = locOf(a), lb = locOf(b);
      return (la?locText(la):'zz').localeCompare(lb?locText(lb):'zz');
    }).forEach(it=>{
      const l = locOf(it);
      const r = el('div','row');
      r.innerHTML = '<div class="th"><img src="'+it.photo+'" alt=""></div>'
        + '<div class="bd"><div class="t1">'+(it.no?'<span style="color:var(--accent);font-size:11.5px;margin-right:6px">'+esc(it.no)+'</span>':'')+esc(it.name)+'</div>'
        + '<div class="t2">'+esc([it.cat,it.sub,it.material,it.color].filter(Boolean).join(' · '))+'</div>'
        + '<div class="t2" style="color:'+(l?'#3f5b4a':'#b4552f')+';font-weight:600">'
        + (l? '放在 '+esc(locText(l)) : '在外（没归位）')+' · '+esc(ownerName(it.owner))+'</div></div>';
      r.onclick = ()=> openItem(it.id);
      c.appendChild(r);
    });
    out.appendChild(c);
    out.appendChild(el('div','hint','点任意一行可以打开这件，看大图或改位置。'));
  }
  ip.oninput = ()=> run(ip.value);
  ip.onchange = ()=> run(ip.value);
  run('');
  mask.classList.add('on');
  setTimeout(function(){ try{ ip.focus(); }catch(e){} }, 120);
}

document.getElementById('fileImport').onchange = e=>{
  const f = e.target.files[0]; e.target.value=''; if(!f) return;
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const o = JSON.parse(fr.result);
      if(!Array.isArray(o.items)) throw new Error('bad');
      if(!confirm('导入会覆盖当前衣橱（'+DB.items.length+' 件），继续？')) return;
      DB.items=o.items; DB.saved=o.saved||[]; DB.locations=o.locations||[]; DB.gaps=o.gaps||[];
      migrate(); save(); renderAll(); toast('已恢复 '+o.items.length+' 件');
    }catch(err){ toast('这个文件不是衣橱备份'); }
  };
  fr.readAsText(f);
};
document.getElementById('btnPrint').onclick = ()=>{
  const area = document.getElementById('printArea');
  area.innerHTML='';
  const locs = DB.locations.filter(l=>!l.owner || l.owner===DB.owner);
  if(!locs.length){ toast('还没有位置'); return; }
  locs.forEach(l=>{
    const inLoc = DB.items.filter(i=>i.locId===l.id);
    const d = el('div','pbox');
    d.innerHTML = '<h3>'+esc(locText(l))+'</h3>'
      + '<div class="pmeta">'+(LOC_LABEL[l.type]||'')+(l.detail?' · '+esc(l.detail):'')+' · '+inLoc.length+' 件 · '+ownerName(DB.owner)+'的衣橱</div>'
      + '<div class="plist">'+ inLoc.map(i=>'<div>'+esc(i.no? i.no+'  ':'')+esc(i.name)
          +'（'+[i.cat,i.sub,i.material].filter(Boolean).join('·')+'）'
          +((i.season||[]).length?' '+(i.season||[]).join('/'):'')
          +(i.desc?' '+esc(i.desc):'')+'</div>').join('') + '</div>';
    area.appendChild(d);
  });
  window.print();
};

/* ================= 数据自检（?diag=1） ================= */
async function runDiag(){
  const rows = [];
  rows.push('存储方式：' + Store.mode);
  rows.push('当前数据库里的件数：' + DB.items.length);
  const byOwner = {};
  DB.items.forEach(function(i){ byOwner[i.owner] = (byOwner[i.owner]||0)+1; });
  rows.push('按归属分：' + (Object.keys(byOwner).map(function(k){ return k+'='+byOwner[k]; }).join('  ') || '（空）'));
  const byCat = {};
  DB.items.forEach(function(i){ byCat[i.cat] = (byCat[i.cat]||0)+1; });
  rows.push('按品类分：' + (Object.keys(byCat).map(function(k){ return k+'='+byCat[k]; }).join('  ') || '（空）'));
  rows.push('Store.err：' + (Store.err || '无'));
  rows.push('');
  const keys = ['wardrobe.v3','wardrobe.bak','wardrobe.v2'];
  for(const k of keys){
    let v = null;
    try{ v = await Store.get(k); }catch(e){ rows.push(k+'：读取异常 ' + e.message); continue; }
    if(!v){ rows.push(k + '：没有这条'); continue; }
    let info = '';
    try{
      const o = JSON.parse(v);
      info = '件数 ' + ((o.items||[]).length);
    }catch(e){
      info = '解析失败（存档损坏）';
    }
    rows.push(k + '：' + info + ' / ' + Math.round(v.length/1024) + ' KB');
  }
  rows.push('');
  try{
    for(const k of keys){
      const v = localStorage.getItem(k);
      rows.push('localStorage.' + k + '：' + (v ? Math.round(v.length/1024)+' KB' : '无'));
    }
  }catch(e){ rows.push('localStorage：读不了（被禁）'); }
  rows.push('');
  rows.push('页面版本：v7.5');
  rows.push('网址来源：' + location.origin + location.pathname + location.search);
  rows.push('浏览器：' + (navigator.userAgent||'').slice(0,120));
  rows.push('打开时间：' + new Date().toLocaleString('zh-CN'));

  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;z-index:99;background:#fff;padding:22px;overflow:auto;font-family:monospace;font-size:13px;line-height:1.7';
  d.innerHTML = '<h3 style="font-family:sans-serif">数据自检</h3>'
    + '<pre style="white-space:pre-wrap;background:#f7f5f1;padding:14px;border-radius:12px">' + esc(rows.join('\n')) + '</pre>'
    + '<p style="font-family:sans-serif;color:#666">把上面这段截图发我。如果没有「wardrobe.v3：件数 N」，说明数据确实没存进去。</p>'
    + '<button style="padding:10px 18px;border-radius:10px;border:1px solid #ccc;background:#fff">关闭</button>';
  d.querySelector('button').onclick = ()=> d.remove();
  document.body.appendChild(d);
}

async function runSelfTest(){
  const rows = [];
  const line = function(name, pass, note){
    rows.push((pass?'✓ 通过  ':'✗ 失败  ') + name + (note? '　—　'+note : ''));
  };
  line('浏览器允许存储', Store.mode==='idb' || Store.mode==='ls', Store.mode);
  try{
    await Store.set('__selftest__', 'hello');
    const v = await Store.get('__selftest__');
    line('写入后能读回', v === 'hello', v === 'hello' ? '正常' : '读回的值不对');
  }catch(e){ line('写入后能读回', false, e.message); }
  line('品类是 12 类', CATS.length === 12, '实际 '+CATS.length+' 类');
  line('编号能生成', /^CO-\d{3}$/.test(nextNo('connie')), nextNo('connie'));
  line('搜索能命中', findMatch({name:'灰色睡衣', cat:'睡衣', sub:'睡衣套装'}, '睡衣') === true);
  line('按人计数正常', OWNERS.every(function(o){ return typeof o[0] === 'string'; }));
  line('自动备份已开', autoFileState === 'on', autoFileState === 'on' ? '好' : '还没开');
  rows.push('');
  rows.push('当前件数：' + DB.items.length);
  const byOwner = {};
  DB.items.forEach(function(i){ byOwner[i.owner] = (byOwner[i.owner]||0)+1; });
  rows.push('按归属：' + (Object.keys(byOwner).map(function(k){ return k+'='+byOwner[k]; }).join('  ') || '（空）'));
  rows.push('页面版本：' + (document.getElementById('brandVer')||{}).textContent);
  rows.push('时间：' + new Date().toLocaleString('zh-CN'));

  const bad = rows.filter(function(r){ return r.indexOf('✗') === 0; }).length;
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;z-index:99;background:#fff;padding:22px;overflow:auto;font-family:monospace;font-size:13px;line-height:1.9';
  d.innerHTML = '<h3 style="font-family:sans-serif;margin-top:0">自检结果：' + (bad? bad+' 项失败' : '全部通过') + '</h3>'
    + '<pre style="white-space:pre-wrap;background:#f7f5f1;padding:14px;border-radius:12px">' + esc(rows.join('\n')) + '</pre>'
    + '<p style="font-family:sans-serif;color:#666">把这一屏截图发我即可。</p>'
    + '<button style="padding:10px 18px;border-radius:10px;border:1px solid #ccc;background:#fff">关闭</button>';
  d.querySelector('button').onclick = function(){ d.remove(); };
  document.body.appendChild(d);
}

/* ================= 启动 ================= */
function showTab(t){
  tab = t;
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on', x.dataset.tab===t));
  ['wardrobe','pending','table','season','lists'].forEach(k=>{ const s=document.getElementById('tab-'+k); if(s) s.hidden = (k!==t); });
  if(t==='wardrobe') renderWardrobe();
  if(t==='pending') renderPending();
  if(t==='table') renderTable();
  if(t==='season') renderSeasonPlan();
  if(t==='lists') renderLists();
  if(window.scrollTo) window.scrollTo(0,0);
}
function renderAll(){
  renderOwnerBox();
  renderSeasonPickers();
  renderWardrobe();
  renderPending();
  renderTable();
  renderSeasonPlan();
  renderLists();
  applyTipState();
  updateStoreStatus();
}
function renderOwnerBox(){
  const box = document.getElementById('whoBox');
  if(!box) return;
  box.innerHTML='';
  OWNERS.forEach(function(x){
    const n = DB.items.filter(function(i){ return i.owner===x[0] && !i.retiredAt; }).length;
    const b = el('button', (DB.owner===x[0] && !pendingAll) ? 'on':'', x[1] + ' ' + n);
    b.dataset.owner = x[0];
    b.onclick = function(){
      pendingAll = false;
      DB.owner = x[0]; save();
      view = {season:'全部', wear:'全部', loc:'全部', cat:'全部', sub:'全部', sleeve:'全部', mat:'全部'};
      searchQ='';
      const s = document.getElementById('fSearch'); if(s) s.value='';
      renderAll();
    };
    box.appendChild(b);
  });
  const pb = el('button', pendingAll ? 'on':'', '新进待处理');
  pb.dataset.owner = '__pending__';
  pb.onclick = function(){
    pendingAll = true;
    renderAll();
    showTab('pending');
  };
  box.appendChild(pb);
}
document.querySelectorAll('nav.tabs button').forEach(b=>{

});

window.addEventListener('paste', e=>{
  const cd = e.clipboardData;
  if(!cd) return;
  const files = [];
  if(cd.items){
    for(let i=0;i<cd.items.length;i++){
      const it = cd.items[i];
      if(it.kind==='file' && /^image\//.test(it.type)){
        const f = it.getAsFile(); if(f) files.push(f);
      }
    }
  }
  if(files.length){ e.preventDefault(); importFiles(files); }
});

(function(){
  const touch = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
  if(touch){
    // 手机上把四个按钮收成一个，避免挡住列表
    ['fabManual','fabAlbum','fabShoot'].forEach(function(id){
      const b = document.getElementById(id); if(b) b.style.display='none';
    });
    const fb = document.getElementById('fab');
    if(fb){ fb.textContent = '＋ 加东西'; fb.onclick = openAddMenu; }
    const tp = document.getElementById('tipText');
    if(tp) tp.textContent = '点右下「＋ 加东西」，按类连拍最省事，一整类只选一次。';
    return;
  }
  const fb = document.getElementById('fab');
  if(fb){ fb.textContent = '🖼 选照片'; fb.onclick = ()=> document.getElementById('fileAlbum').click(); }
  const ab = document.getElementById('fabAlbum'); if(ab) ab.style.display='none';
  const tp = document.getElementById('tipText');
  if(tp) tp.textContent = '拖拽照片到窗口 / 复制图片后按 Ctrl+V / 点右下「选照片」，三种都行，可一次多张。';

function applyTipState(){

  if(bar && DB.tipClosed) bar.classList.add('hide');
}
const tipClose = document.getElementById('tipClose');

  DB.tipClosed = true; save();
  document.getElementById('tipbar').classList.add('hide');
};

function showStoreBanner(){
  const bar = document.getElementById('warnbar');
  if(!bar) return;
  const ua = (navigator && navigator.userAgent) || '';
  const wechat = /MicroMessenger/i.test(ua);
  const isFile = (location && location.protocol === 'file:');
  let msg;
  if(isFile){
    msg = '你是双击本地文件打开的。Chrome / Edge 不允许本地文件存数据，'
        + '改用这个网址打开：<a href="https://conniefu2003.github.io/wardrobe/" target="_blank">conniefu2003.github.io/wardrobe</a>';
  }else if(wechat){
    msg = '你在微信里打开，微信不让网页存东西。点右上角「···」→「在浏览器打开」，再重新加一次。';
  }else{
    msg = '这个浏览器禁用了本地存储。换 Chrome / Safari 打开；iPhone 还要看「设置 → Safari → 阻止所有 Cookie」。';
  }
  bar.innerHTML = '<b>数据存不下来</b><span>'+msg+'<br><small>'+esc(Store.err||'')+' · '+esc(location.protocol)+esc(location.host||'')+'</small></span>'
    + '<button class="mini" id="bannerExport">先导出备份</button>';
  bar.classList.add('on');
  const be = document.getElementById('bannerExport');
  if(be) be.onclick = doExport;
}

curSeason = seasonByMonth();
const WANT_DIAG = (location.search||'').indexOf('diag') >= 0;
const WANT_TEST = (location.search||'').indexOf('selftest') >= 0;
/* 自更新：页面是旧版时，自动换成新版地址再打开一次（同一会话只做一次，避免循环） */
(function(){
  const BUILD = '91';
  const bv = document.getElementById('brandVer');
  if(bv) bv.textContent = 'WARDROBE · v' + (parseInt(BUILD,10)/10).toFixed(1);
  try{
    fetch('version.json?t=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(o){
        if(!o || !o.v || String(o.v) === BUILD) return;
        if(sessionStorage.getItem('_vfix_'+BUILD)) return;
        sessionStorage.setItem('_vfix_'+BUILD, '1');
        const u = new URL(location.href);
        u.searchParams.set('v', o.v);
        location.replace(u.toString());
      }).catch(function(){});
  }catch(e){}
})();
load().then(async mode=>{
  await restoreAutoBackupHandle();
  renderAll();
  if(mode==='memory'){ DB.memOnly = true; showStoreBanner(); toast('这个浏览器不让存数据，先看顶部提示'); }
  if(WANT_DIAG) runDiag();
  if(WANT_TEST) runSelfTest();
}).catch(err=>{
  console.warn('启动失败', err);
  migrate(); renderAll(); showStoreBanner();
  if(WANT_DIAG) runDiag();
  if(WANT_TEST) runSelfTest();
});
