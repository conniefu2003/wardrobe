<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的衣橱">
<meta name="theme-color" content="#3f5b4a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>我的衣橱</title>
<style>
  :root{
    --bg:#f7f5f1; --card:#ffffff; --ink:#2b2823; --sub:#7c756a; --line:#e9e4da;
    --accent:#3f5b4a; --accent-soft:#eef2ed; --warn:#b4552f; --warn-soft:#fbeee8;
    --blue:#3a5f8f; --blue-soft:#eaeff5;
    --radius:18px; --shadow:0 2px 10px rgba(43,40,35,.06), 0 12px 30px rgba(43,40,35,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;padding-bottom:110px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;}
  header{position:sticky;top:0;z-index:20;background:rgba(247,245,241,.93);
    backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
  .head-in{max-width:1000px;margin:0 auto;padding:14px 18px 10px;display:flex;align-items:center;gap:10px}
  .brand{font-size:19px;font-weight:700;letter-spacing:.5px}
  .brand small{display:block;font-size:11px;font-weight:400;color:var(--sub);letter-spacing:1.6px}
  .head-spacer{flex:1}
  .icon-btn{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:12px;
    padding:7px 11px;font-size:13px;cursor:pointer;font-family:inherit}
  .icon-btn:hover{color:var(--ink);border-color:#d8d2c6}
  nav.tabs{max-width:1000px;margin:0 auto;padding:0 14px 11px;display:flex;gap:6px}
  nav.tabs button{flex:1;border:none;background:transparent;color:var(--sub);font-size:14px;
    padding:9px 0;border-radius:12px;cursor:pointer;font-weight:600;font-family:inherit;white-space:nowrap}
  nav.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  main{max-width:1000px;margin:0 auto;padding:18px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;
    padding:6px 14px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.15s}
  .chip:hover{border-color:#d5cec1}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .hint{color:var(--sub);font-size:13px;margin:12px 2px 16px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
  .sec{margin:26px 0 12px;display:flex;align-items:baseline;gap:10px}
  .sec h2{margin:0;font-size:16px}
  .sec .cnt{font-size:12.5px;color:#fff;background:var(--ink);border-radius:999px;padding:1px 9px}
  .sec .cnt.warn{background:var(--warn)}
  .sec .cnt.zero{background:#cdc7ba}
  .sec .sp{flex:1}

  .outfit{padding:16px;margin-bottom:14px}
  .outfit-top{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
  .outfit-no{font-size:12px;color:var(--sub);letter-spacing:1px}
  .score{font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:999px}
  .pieces{display:flex;gap:10px;margin:12px 0 10px;overflow-x:auto;padding-bottom:2px}
  .piece{width:104px;flex:0 0 auto;text-align:center}
  .piece .ph{width:104px;height:132px;border-radius:14px;overflow:hidden;background:#f0ece4;border:1px solid var(--line)}
  .piece img{width:100%;height:100%;object-fit:cover;display:block}
  .piece .nm{font-size:11.5px;color:var(--sub);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .why{font-size:13.5px;color:#4a453d;background:#faf8f4;border-radius:12px;padding:10px 12px}
  .outfit-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .mini{border:none;background:#f2efe8;color:#57513f;border-radius:10px;padding:7px 13px;
    font-size:13px;cursor:pointer;font-family:inherit}
  .mini:hover{background:#eae5da}
  .mini.on{background:var(--accent);color:#fff}
  .mini.ghost{background:#fff;border:1px solid var(--line)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;margin-top:14px}
  .item{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;
    cursor:pointer;box-shadow:0 1px 4px rgba(43,40,35,.04);transition:.15s}
  .item:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .item .ph{aspect-ratio:3/4;background:#f0ece4;overflow:hidden}
  .item img{width:100%;height:100%;object-fit:cover;display:block}
  .item .meta{padding:8px 10px 10px}
  .item .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .tg{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:5px;margin-top:3px}
  .dot{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.12);flex:0 0 auto}
  .badge{position:absolute;top:7px;left:7px;font-size:10.5px;padding:2px 7px;border-radius:8px;
    background:rgba(43,40,35,.78);color:#fff;backdrop-filter:blur(4px);letter-spacing:.4px}
  .badge.b{background:rgba(58,95,143,.9)}
  .badge.w{background:rgba(180,85,47,.92)}
  .item.sel{outline:2.5px solid var(--accent);outline-offset:-2px}
  .tick{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;
    background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
  .item.sel .tick{background:var(--accent);border-color:var(--accent)}

  .row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .th{width:52px;height:66px;border-radius:10px;overflow:hidden;background:#f0ece4;flex:0 0 auto}
  .row .th img{width:100%;height:100%;object-fit:cover;display:block}
  .row .bd{flex:1;min-width:0}
  .row .t1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .t2{font-size:12px;color:var(--sub);margin-top:2px}
  .tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;background:var(--warn-soft);color:var(--warn);margin-right:5px}
  .tag.b{background:var(--blue-soft);color:var(--blue)}
  .tag.g{background:var(--accent-soft);color:var(--accent)}

  .boxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;
    box-shadow:0 1px 4px rgba(43,40,35,.04);transition:.15s}
  .box:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .box .code{font-size:17px;font-weight:700;letter-spacing:1px}
  .box .place{font-size:12px;color:var(--sub);margin-top:2px}
  .box .thumbs{display:flex;gap:5px;margin-top:10px}
  .box .thumbs div{width:38px;height:48px;border-radius:8px;overflow:hidden;background:#f0ece4}
  .box .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
  .box .more{font-size:12px;color:var(--sub);margin-top:8px}

  .gaprow{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .gaprow:last-child{border-bottom:none}
  .cbx{width:20px;height:20px;border-radius:6px;border:1.5px solid #d5cec1;flex:0 0 auto;margin-top:2px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
  .cbx.on{background:var(--accent);border-color:var(--accent)}
  .gaprow.done .t1{text-decoration:line-through;color:var(--sub)}

  #fabWrap{position:fixed;right:20px;bottom:22px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  #fab{border:none;background:var(--accent);color:#fff;border-radius:999px;padding:14px 22px;
    font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
    box-shadow:0 8px 24px rgba(63,91,74,.32)}
  #fab:hover{filter:brightness(1.08)}
  #tipbar{display:flex;gap:8px;align-items:center;margin:0 0 14px;
    background:#fffdf8;border:1px solid #efe0cf;border-radius:14px;padding:10px 12px;font-size:12.5px;
    color:#6b5b4a;line-height:1.4}
  #tipbar b{flex:0 0 auto;color:#8a5a3b}
  #tipbar span{flex:1}
  #tipbar.hide{display:none}
  #warnbar{display:none;padding:12px 18px;background:#fbeee8;border-bottom:1px solid #f0d9cf;
    font-size:13px;color:#8a4326;line-height:1.5}
  #warnbar.on{display:flex;align-items:center;gap:10px}
  #warnbar b{flex:0 0 auto}
  #warnbar span{flex:1;max-width:840px}
  #warnbar a{color:#8a4326}
  #warnbar small{opacity:.7;font-size:11.5px}
  #warnbar .mini{flex:0 0 auto;background:#fff;border:1px solid #f0d9cf}
  .fab-mini{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:999px;
    padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .fab-mini:hover{color:var(--ink)}
  #quickbar{position:fixed;left:12px;right:12px;bottom:14px;z-index:35;display:none;align-items:center;gap:10px;
    background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 12px;
    box-shadow:0 12px 34px rgba(43,40,35,.18)}
  #quickbar.on{display:flex}
  #quickbar img{width:44px;height:56px;border-radius:9px;object-fit:cover;background:#f0ece4;flex:0 0 auto}
  #quickbar .qt{font-size:13px;color:var(--ink);flex:1;line-height:1.35}
  #quickbar .qt small{display:block;color:var(--sub);font-size:11.5px}
  #batchbar{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;gap:8px;align-items:center;
    box-shadow:0 -6px 24px rgba(43,40,35,.10);flex-wrap:wrap}
  #batchbar.on{display:flex}
  #batchbar .cnt{font-size:13px;color:var(--sub);margin-right:auto}

  .mask{position:fixed;inset:0;background:rgba(30,28,24,.42);z-index:40;display:none;align-items:flex-end;justify-content:center}
  .mask.on{display:flex}
  .sheet{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;
    padding:8px 20px 26px;animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;
    background:#fff;padding:14px 0 10px;z-index:2}
  .sheet-head h3{margin:0;font-size:16px}
  .x{border:none;background:#f2efe8;border-radius:10px;width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--sub)}
  .field{margin:16px 0}
  .lab{font-size:12.5px;color:var(--sub);margin-bottom:8px;letter-spacing:.4px}
  .pick{border:1.5px dashed #d9d2c5;border-radius:16px;background:#faf8f4;aspect-ratio:4/3;
    display:flex;align-items:center;justify-content:center;color:var(--sub);cursor:pointer;overflow:hidden;position:relative;text-align:center}
  .pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pick .tip{font-size:13px;position:relative;z-index:1;padding:18px;background:rgba(255,255,255,.86);border-radius:10px}
  input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    font-size:15px;font-family:inherit;color:var(--ink);background:#fff;outline:none}
  input[type=text]:focus{border-color:var(--accent)}
  .cta{width:100%;border:none;background:var(--accent);color:#fff;border-radius:14px;padding:14px;
    font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
  .cta:disabled{background:#c9c4b8;cursor:not-allowed}
  .danger{background:#fff;color:var(--warn);border:1px solid #f0d9cf}
  .empty{text-align:center;color:var(--sub);padding:44px 20px}
  .empty .big{font-size:38px;margin-bottom:8px;opacity:.45}
  .colorbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .swatch{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px 5px 7px;
    font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;color:var(--sub)}
  .swatch.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
  #dropzone{position:fixed;inset:10px;z-index:50;display:none;align-items:center;justify-content:center;
    border:3px dashed var(--accent);border-radius:24px;background:rgba(247,245,241,.86);pointer-events:none}
  #dropzone.on{display:flex}
  #dropzone div{text-align:center;color:var(--accent)}
  #dropzone b{display:block;font-size:20px;margin-bottom:6px}
  #dropzone small{color:var(--sub);font-size:13px}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#2b2823;color:#fff;
    padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
  .toast.on{opacity:1}
  .sub{font-size:12px;color:var(--sub)}
  #printArea{display:none}
  @media print{
    body{background:#fff;padding:0}
    header,main,#fabWrap,#batchbar,.mask,.toast,#quickbar,#dropzone{display:none !important}
    #printArea{display:block;padding:0}
    .pbox{page-break-after:always;padding:10mm}
    .pbox:last-child{page-break-after:auto}
    .pbox h3{font-size:20px;margin:0 0 4px}
    .pbox .pmeta{font-size:12px;color:#666;margin-bottom:10px}
    .pbox .plist{font-size:12px;columns:2;column-gap:8mm}
    .pbox .plist div{padding:2px 0;border-bottom:1px dotted #ddd;break-inside:avoid}
  }
  @media (max-width:560px){
    main{padding:14px}
    .piece{width:88px}.piece .ph{width:88px;height:112px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
    nav.tabs button{font-size:13px}
  }
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div class="brand">我的衣橱<small>WARDROBE</small></div>
    <div class="head-spacer"></div>
    <button class="icon-btn" id="btnExport">备份</button>
    <button class="icon-btn" id="btnImport">恢复</button>
    <button class="icon-btn" id="btnPrint">箱单</button>
  </div>
  <nav class="tabs">
    <button data-tab="outfit" class="on">今天穿</button>
    <button data-tab="wardrobe">衣橱</button>
    <button data-tab="lists">清单</button>
    <button data-tab="saved">搭配</button>
  </nav>
</header>
<div id="warnbar"></div>

<main>
  <section id="tab-outfit">
    <div class="chips" id="seasonChips"></div>
    <div class="chips" style="margin-top:10px">
      <button class="chip" id="chipUnworn">只配「买了没穿」的</button>
    </div>
    <div class="hint" id="outfitHint"></div>
    <div id="outfitList"></div>
  </section>

  <section id="tab-wardrobe" hidden>
    <div id="tipbar">
      <b>照片怎么进来</b>
      <span id="tipText">微信里收到的图：长按 → 保存到相册 → 回这里点「从相册选」，可一次选多张。</span>
      <button class="mini ghost" id="tipClose">知道了</button>
    </div>
    <div class="chips" id="catChips"></div>
    <div class="chips" id="storeChips"></div>
    <div style="margin-top:10px">
      <button class="chip" id="chipBatch">批量收纳 · 多选</button>
    </div>
    <div id="gridWrap"></div>
  </section>

  <section id="tab-lists" hidden>
    <div class="sec"><h2>买了没穿</h2><span class="cnt warn" id="cUnworn">0</span><span class="sp"></span></div>
    <div class="hint" style="margin:-4px 2px 12px">按原因分组。不知道怎么搭的直接点「配它」，穿不舒服的先修或出掉。</div>
    <div id="unwornWrap"></div>

    <div class="sec"><h2>缺的那一件</h2><span class="cnt" id="cGap">0</span><span class="sp"></span>
      <button class="mini ghost" id="btnAddGap">＋ 记一条</button></div>
    <div id="gapWrap"></div>

    <div class="sec"><h2>换季收纳</h2><span class="cnt" id="cBox">0</span><span class="sp"></span>
      <button class="mini ghost" id="btnAddBox">＋ 新建箱</button></div>
    <div class="hint" style="margin:-4px 2px 12px">每只箱子一个编号，点开能看里面有什么；「箱单」可打印出来贴在箱子上。</div>
    <div id="boxWrap"></div>
  </section>

  <section id="tab-saved" hidden>
    <div id="savedWrap"></div>
  </section>
</main>

<div id="fabWrap">
  <button id="fabManual" class="fab-mini">手动加一件</button>
  <button id="fabAlbum" class="fab-mini">从相册选</button>
  <button id="fab">📷 拍照</button>
</div>

<div id="dropzone"><div><b>松手就存进衣橱</b><small>一次拖多张也行</small></div></div>
<div id="quickbar">
  <img id="quickThumb" alt="">
  <div class="qt"><span id="quickMsg">已入库</span><small>先存着，品类回头点一下补</small></div>
  <button class="mini on" id="quickAgain">再拍一张</button>
  <button class="mini ghost" id="quickDone">完成</button>
</div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileAlbum" accept="image/*" multiple hidden>
<div id="batchbar">
  <span class="cnt" id="selCount">已选 0 件</span>
  <button class="mini" id="bToBox">收进箱子</button>
  <button class="mini" id="bOutBox">放回衣橱</button>
  <button class="mini" id="bUnworn">标记没穿</button>
  <button class="mini ghost" id="bCancel">取消</button>
</div>

<div id="printArea"></div>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="fileImport" accept="application/json,.json" hidden>
<div class="toast" id="toast"></div>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>

<script>
/* ================= 常量 ================= */
const CATS = ['上装','下装','外套','连衣裙','鞋','包','配饰','睡衣'];
const SUBCATS = {
  '上装':['T恤','衬衫','针织衫','卫衣','吊带','打底衫'],
  '下装':['牛仔裤','西装裤','休闲裤','半身裙','短裤','阔腿裤'],
  '外套':['西装外套','风衣','夹克','大衣','羽绒服','开衫'],
  '连衣裙':['连衣裙','吊带裙','衬衫裙'],
  '鞋':['小白鞋','乐福鞋','高跟鞋','靴子','凉鞋','运动鞋'],
  '包':['托特包','小方包','斜挎包','双肩包'],
  '配饰':['围巾','腰带','帽子','首饰'],
  '睡衣':['睡衣套装','睡裙','吊带睡裙','居家服','浴袍']
};
const SEASONS = ['春','夏','秋','冬','四季'];
const SCENES = ['通勤','休闲','正式','运动','家居'];
const WEARS = ['常穿','偶尔','没穿'];
const REASONS = ['不知道怎么搭','穿了不舒服','尺码不合','没场合穿','忘了有','旧了起球'];
const REASON_TIP = {
  '不知道怎么搭':'点「配它」，让衣橱给你出三套',
  '穿了不舒服':'先标记「待修」，修不好就出掉',
  '尺码不合':'改衣或出掉，别留三年',
  '没场合穿':'给它找个场合，找不到就出掉',
  '忘了有':'挪到看得见的位置',
  '旧了起球':'直接出掉'
};
const REASON_ACTION = {
  '不知道怎么搭':'→ 点「配它」出三套',
  '穿了不舒服':'→ 先修，修不好出掉',
  '尺码不合':'→ 改衣，不然出掉',
  '没场合穿':'→ 找场合，找不到出',
  '忘了有':'→ 挪到看得见处',
  '旧了起球':'→ 直接出掉'
};
const COLORS = [
  {n:'黑',h:'#1c1c1e'},{n:'白',h:'#f4f2ee'},{n:'灰',h:'#9b9b9b'},{n:'米',h:'#ded2bb'},
  {n:'棕',h:'#8b5e3c'},{n:'红',h:'#b03a3a'},{n:'橙',h:'#d08437'},{n:'黄',h:'#d3c04a'},
  {n:'绿',h:'#4d7a55'},{n:'蓝',h:'#3a5f8f'},{n:'紫',h:'#6b4f7d'},{n:'粉',h:'#d6a3ab'}
];
const NEUTRAL = {'黑':1,'白':1,'灰':1,'米':1,'棕':.6};
const HUE = {'红':0,'橙':28,'黄':52,'绿':130,'蓝':212,'紫':272,'粉':332,'棕':25,'米':40,'黑':0,'白':0,'灰':0};

/* ================= 存取 ================= */
const KEY = 'wardrobe.v2';
let DB = {items:[], saved:[], boxes:[], gaps:[], season:null, memOnly:false};

/* ---------- 存储层：IndexedDB → localStorage → 内存 ---------- */
const Store = {
  mode: 'pending', idb: null,
  lsOk(){
    try{ const k='__wtest__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  },
  openIdb(){
    return new Promise((res,rej)=>{
      try{
        if(!window.indexedDB) return rej(new Error('no indexedDB'));
        const req = window.indexedDB.open('wardrobeDB', 1);
        req.onupgradeneeded = ()=>{ try{ req.result.createObjectStore('kv'); }catch(e){} };
        req.onsuccess = ()=> res(req.result);
        req.onerror = ()=> rej(req.error || new Error('idb error'));
        req.onblocked = ()=> rej(new Error('idb blocked'));
        setTimeout(()=>rej(new Error('idb timeout')), 3000);
      }catch(e){ rej(e); }
    });
  },
  async open(){
    this.err = '';
    try{ this.idb = await this.openIdb(); this.mode = 'idb'; return this.mode; }
    catch(e){ console.warn('IndexedDB 不可用', e); this.err = 'IndexedDB 打不开：' + ((e && e.message) || e); }
    if(this.lsOk()){ this.mode = 'ls'; return this.mode; }
    this.err += ' ／ localStorage 也被禁';
    this.mode = 'memory'; return this.mode;
  },
  get(key){
    if(this.mode==='idb'){
      return new Promise(res=>{
        try{
          const rq = this.idb.transaction('kv','readonly').objectStore('kv').get(key);
          rq.onsuccess = ()=> res(rq.result || null);
          rq.onerror = ()=> res(null);
        }catch(e){ res(null); }
      });
    }
    if(this.mode==='ls'){ try{ return Promise.resolve(localStorage.getItem(key)); }catch(e){ return Promise.resolve(null); } }
    return Promise.resolve(null);
  },
  set(key,val){
    if(this.mode==='idb'){
      return new Promise(res=>{
        try{
          const tx = this.idb.transaction('kv','readwrite');
          tx.objectStore('kv').put(val, key);
          tx.oncomplete = ()=> res(true);
          tx.onerror = ()=> res(false);
          tx.onabort = ()=> res(false);
        }catch(e){ res(false); }
      });
    }
    if(this.mode==='ls'){
      try{ localStorage.setItem(key,val); return Promise.resolve(true); }
      catch(e){ return Promise.resolve(false); }
    }
    return Promise.resolve(false);
  }
};

function applyDefaults(){
  if(!DB.season) DB.season = seasonByMonth();
  DB.items = DB.items || []; DB.saved = DB.saved || [];
  DB.boxes = DB.boxes || []; DB.gaps = DB.gaps || [];
  DB.items.forEach(it=>{ if(!it.wear) it.wear = '常穿'; if(!it.reason) it.reason=''; if(!it.box) it.box=''; });
}
async function load(){
  const mode = await Store.open();
  let raw = null;
  try{ raw = await Store.get(KEY); }catch(e){}
  if(!raw){
    try{
      const legacy = localStorage.getItem(KEY);
      if(legacy){ raw = legacy; await Store.set(KEY, legacy); }
    }catch(e){}
  }
  if(raw){ try{ DB = Object.assign(DB, JSON.parse(raw)); }catch(e){ console.warn('旧数据读不出来', e); } }
  applyDefaults();
  return mode;
}
function save(){
  const payload = JSON.stringify({items:DB.items, saved:DB.saved, boxes:DB.boxes, gaps:DB.gaps, season:DB.season});
  DB.lastSize = payload.length / 1048576;
  if(Store.mode === 'memory' || Store.mode === 'pending'){ DB.memOnly = true; return; }
  Store.set(KEY, payload).then(ok=>{
    if(ok) return;
    if(Store.mode === 'ls'){
      Store.openIdb().then(idb=>{ Store.idb = idb; Store.mode = 'idb'; return Store.set(KEY, payload); })
        .then(ok2=>{ if(!ok2) throw new Error('idb set fail'); })
        .catch(()=>{ DB.memOnly = true; toast('存不进去了，先点「备份」导出'); });
    }else{
      DB.memOnly = true;
      toast('存不进去了，先点「备份」导出');
    }
  });
}
function seasonByMonth(){
  const m = new Date().getMonth()+1;
  if(m>=3&&m<=5) return '春';
  if(m>=6&&m<=8) return '夏';
  if(m>=9&&m<=11) return '秋';
  return '冬';
}

function esc(s){ return String(s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function el(tag, cls, html){

/* ================= 取色 ================= */
function rgb2hsv(r,g,b){
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0;
  if(d){ if(mx===r) h=((g-b)/d)%6; else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360; }
  return {h, s: mx? d/mx : 0, v: mx};
}
function colorNameOf(r,g,b){
  const {h,s,v} = rgb2hsv(r,g,b);
  if(s <= 0.13){
    if(v >= 0.86) return '白';
    if(v <= 0.22) return '黑';
    if(h>=20&&h<=50&&v>0.7) return '米';
    return '灰';
  }
  if(v > 0.72 && s < 0.45 && (h >= 320 || h < 12)) return '粉';
  if(s < 0.42 && v < 0.62 && h >= 10 && h <= 45) return '棕';
  if(s < 0.26 && v > 0.74 && h >= 25 && h <= 55) return '米';
  if(h < 16 || h >= 345) return '红';
  if(h < 42) return s>0.6&&v>0.75 ? '橙' : '棕';
  if(h < 70) return '黄';
  if(h < 168) return '绿';
  if(h < 250) return '蓝';
  if(h < 300) return '紫';
  if(h < 345) return (v>0.72&&s<0.5) ? '粉' : '紫';
  return '红';
}
function dominantColor(img){
  const S = 64;
  const c = document.createElement('canvas'); c.width=S; c.height=S;
  const ctx = c.getContext('2d', {willReadFrequently:true});
  const side = Math.min(img.width, img.height), crop = side*0.6;
  ctx.drawImage(img, (img.width-crop)/2, (img.height-crop)/2, crop, crop, 0, 0, S, S);
  const d = ctx.getImageData(0,0,S,S).data;
  const bk = {};
  for(let i=0;i<d.length;i+=4){
    const k = ((d[i]>>4)<<8)|((d[i+1]>>4)<<4)|(d[i+2]>>4);
    const o = bk[k] || (bk[k]={n:0,r:0,g:0,b:0});
    o.n++; o.r+=d[i]; o.g+=d[i+1]; o.b+=d[i+2];
  }
  let best=null; for(const k in bk){ if(!best||bk[k].n>best.n) best=bk[k]; }
  if(!best) return {name:'灰', hex:'#9b9b9b'};
  const r=Math.round(best.r/best.n), g=Math.round(best.g/best.n), b=Math.round(best.b/best.n);
  return {name: colorNameOf(r,g,b), hex:'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')};
}
function compress(file, maxSide=760){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const sc = Math.min(1, maxSide/Math.max(img.width,img.height));
        const w = Math.round(img.width*sc), h = Math.round(img.height*sc);
        const c = document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve({dataURL:c.toDataURL('image/jpeg',0.72), img});
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ================= 搭配引擎 ================= */
function seasonOk(it,s){ return !it.season||!it.season.length || it.season.includes('四季') || it.season.includes(s); }
function colorPair(a,b){
  if(a===b) return NEUTRAL[a] ? 60 : 78;
  const an = !!NEUTRAL[a], bn = !!NEUTRAL[b];
  if(an && bn) return 72;
  if(an || bn) return 88;
  const d = Math.abs(HUE[a]-HUE[b]); const dd = Math.min(d,360-d);
  if(dd <= 30) return 82;
  if(dd >= 120) return 76;
  return 66;
}
function scoreOutfit(parts){
  let sc=0, pairs=0;
  for(let i=0;i<parts.length;i++) for(let j=i+1;j<parts.length;j++){ sc += colorPair(parts[i].color, parts[j].color); pairs++; }
  let base = pairs ? sc/pairs : 70;
  const cs = parts.map(p=>p.color);
  const loud = cs.filter(c=>!NEUTRAL[c] && c!=='棕').length;
  if(loud>=3) base -= 12;
  if(loud===0) base -= 4;
  return Math.max(0, Math.round(base));
}
function whyText(parts){
  const cols = [...new Set(parts.map(p=>p.color))];
  const colored = cols.filter(c=>!NEUTRAL[c]);
  const neutral = cols.filter(c=>NEUTRAL[c]);
  const bits = [];
  if(colored.length===0) bits.push('全中性色，稳妥不出错，靠版型和材质撑住');
  else if(neutral.length>=2) bits.push(neutral.slice(0,2).join('、')+'打底，'+colored[0]+'提气色');
  else if(neutral.length===1) bits.push(neutral[0]+'压住全身，'+colored.join('、')+'做重点');
  else bits.push(colored.join('＋')+'撞色，配饰别再加第三个亮色');
  const scenes = parts.reduce((a,p)=>a.concat(p.scene||[]),[]);
  const common = SCENES.filter(s=>scenes.filter(x=>x===s).length>=2)[0];
  if(common) bits.push('两边都够'+common);
  return bits.join('；')+'。';
}
let onlyUnworn = false;

function pickOutfits(opts){
  const {season, mustId} = opts||{};
  let pool = DB.items.filter(it=> it.status!=='可出' && it.cat!=='睡衣' && it.cat!=='待分类'); // 睡衣和待分类不进搭配池
  if(onlyUnworn) pool = pool.filter(it=> it.wear!=='常穿');
  const ok = it => seasonOk(it, season);
  const tops = pool.filter(i=>i.cat==='上装'&&ok(i));
  const bottoms = pool.filter(i=>i.cat==='下装'&&ok(i));
  const dresses = pool.filter(i=>i.cat==='连衣裙'&&ok(i));
  const shoes = pool.filter(i=>i.cat==='鞋'&&ok(i));
  const outers = pool.filter(i=>i.cat==='外套'&&ok(i));
  const bags = pool.filter(i=>i.cat==='包'&&ok(i));
  const rnd = a => a[Math.floor(Math.random()*a.length)];
  const cands = [];
  if(tops.length && bottoms.length){
    for(const t of tops) for(const b of bottoms){
      const extra = [];
      if(shoes.length) extra.push(rnd(shoes));
      if((season==='冬'||season==='秋') && outers.length && Math.random()<0.55) extra.push(rnd(outers));
      if(bags.length && Math.random()<0.4) extra.push(rnd(bags));
      cands.push([t,b,...extra]);
    }
  }
  for(const d of dresses){
    const extra = [];
    if(season!=='夏' && outers.length && Math.random()<0.5) extra.push(rnd(outers));
    if(shoes.length) extra.push(rnd(shoes));
    cands.push([d,...extra]);
  }
  let scored = cands.map(parts=>({parts, score:scoreOutfit(parts)}));
  if(mustId) scored = scored.filter(o=>o.parts.some(p=>p.id===mustId));
  scored.sort((a,b)=> (b.score-a.score) + (Math.random()-0.5)*2);
  const seen = new Set(), out = [];
  for(const o of scored){
    const key = o.parts.map(p=>p.id).join('|');
    const top = (o.parts.find(p=>p.cat==='上装'||p.cat==='连衣裙')||{}).id;
    if(seen.has(key) || (top&&seen.has('T'+top))) continue;
    seen.add(key); if(top) seen.add('T'+top);
    out.push(o); if(out.length>=3) break;
  }
  return out;
}

function renderSaved(){

/* ================= 单件详情（即编辑器） ================= */
const SUBCATS_FLAT = Object.keys(SUBCATS).reduce((a,k)=>a.concat(SUBCATS[k]),[]);

function openItem(id, jumpPair){
  const it = DB.items.find(x=>x.id===id);
  if(!it) return;
  sheet.innerHTML='';
  sheetHead(it.name);

  const f = el('div','field');
  f.innerHTML = '<div class="pick" style="aspect-ratio:4/5;cursor:default"><img src="'+it.photo+'" alt=""></div>';
  sheet.appendChild(f);

  const info = el('div','why');
  info.innerHTML = it.cat + (it.sub?' · '+it.sub:'') + ' ｜ ' + it.color + ' ｜ '
    + (it.season||[]).join('/') + ' ｜ ' + (it.scene||[]).join('/');
  sheet.appendChild(info);

  // 品类（待分类的在这里补）
  const f0 = el('div','field');
  f0.appendChild(el('div','lab', it.cat==='待分类' ? '这件是什么？点一下补上' : '品类'));
  const c0 = el('div','chips');
  CATS.forEach(c=>{
    const b = el('button','chip'+(it.cat===c?' on':''), c);
    b.onclick = ()=>{
      it.cat = c;
      if(it.sub && (SUBCATS[c]||[]).indexOf(it.sub)<0) it.sub = '';
      if(/^待分类/.test(it.name) || !it.name) it.name = it.color + (it.sub||c);
      save(); openItem(it.id, jumpPair);
    };
    c0.appendChild(b);
  });
  f0.appendChild(c0);
  if(it.cat!=='待分类'){
    const c0b = el('div','chips'); c0b.style.marginTop = '8px';
    (SUBCATS[it.cat]||[]).forEach(s=>{
      const b = el('button','chip'+(it.sub===s?' on':''), s);
      b.onclick = ()=>{ it.sub = it.sub===s? '' : s; save(); openItem(it.id, jumpPair); };
      c0b.appendChild(b);
    });
    if(c0b.children.length) f0.appendChild(c0b);
  }
  sheet.appendChild(f0);

  // 穿用状态
  const f1 = el('div','field');
  f1.appendChild(el('div','lab','穿的情况'));
  const c1 = el('div','chips');
  WEARS.forEach(w=>{
    const b = el('button','chip'+(it.wear===w?' on':''), w);
    b.onclick = ()=>{
      it.wear = w;
      if(w!=='常穿' && !it.reason) it.reason = REASONS[0];
      if(w==='常穿') it.reason = '';
      save(); openItem(it.id);
    };
    c1.appendChild(b);
  });
  f1.appendChild(c1); sheet.appendChild(f1);

  // 没穿原因
  if(it.wear!=='常穿'){
    const f2 = el('div','field');
    f2.appendChild(el('div','lab','为什么没在穿'));
    const c2 = el('div','chips');
    REASONS.forEach(r=>{
      const b = el('button','chip'+(it.reason===r?' on':''), r);
      b.onclick = ()=>{ it.reason = it.reason===r? '' : r; save(); openItem(it.id); };
      c2.appendChild(b);
    });
    f2.appendChild(c2);
    if(it.reason) f2.appendChild(el('div','sub','建议：'+(REASON_TIP[it.reason]||'')));
    sheet.appendChild(f2);
  }

  // 存放
  const f3 = el('div','field');
  f3.appendChild(el('div','lab','放在哪'));
  const c3 = el('div','chips');
  const bHome = el('button','chip'+(!it.box?' on':''), '在衣橱');
  bHome.onclick = ()=>{ it.box=''; save(); openItem(it.id, jumpPair); };
  c3.appendChild(bHome);
  DB.boxes.forEach(b=>{
    const btn = el('button','chip'+(it.box===b.id?' on':''), b.code);
    btn.onclick = ()=>{ it.box=b.id; save(); openItem(it.id, jumpPair); };
    c3.appendChild(btn);
  });
  const bNew = el('button','chip','＋ 新箱');
  bNew.onclick = ()=> openBoxForm((newBox)=>{ it.box = newBox.id; save(); openItem(it.id, jumpPair); });
  c3.appendChild(bNew);
  f3.appendChild(c3); sheet.appendChild(f3);

  // 操作
  const acts = el('div','outfit-actions');
  acts.style.marginTop='6px';
  const bPair = el('button','mini on','和它配什么');
  acts.appendChild(bPair);
  const bName = el('button','mini ghost','改名');
  bName.onclick = ()=>{
    const n = prompt('叫什么？', it.name);
    if(n && n.trim()){ it.name = n.trim(); save(); openItem(it.id, jumpPair); }
  };
  acts.appendChild(bName);
  sheet.appendChild(acts);

  const out = el('div'); sheet.appendChild(out);
  const showPair = ()=>{
    const res = pickOutfits({season:DB.season, mustId:it.id});
    out.innerHTML='';
    if(!res.length){
      out.appendChild(el('div','why','衣橱里暂时没有能跟它凑成整套的。补一条下装或一双鞋再试。'));
      return;
    }
    out.appendChild(el('div','lab','和它最搭的几套'));
    res.forEach((o,i)=>{
      const c = el('div','card outfit'); c.style.boxShadow='none';
      c.appendChild(el('div','outfit-top','<span class="outfit-no">搭配 '+String(i+1).padStart(2,'0')+'</span><span class="score">契合度 '+o.score+'</span>'));
      const ps = el('div','pieces'); o.parts.forEach(p=>ps.appendChild(pieceNode(p))); c.appendChild(ps);
      c.appendChild(el('div','why', whyText(o.parts)));
      out.appendChild(c);
    });
    out.scrollIntoView({behavior:'smooth', block:'nearest'});
  };
  bPair.onclick = showPair;
  if(jumpPair) setTimeout(showPair, 60);

  const del = el('button','cta danger','从衣橱删掉这件');
  del.style.marginTop='18px';
  del.onclick = ()=>{
    if(!confirm('删掉「'+it.name+'」？')) return;
    DB.items = DB.items.filter(x=>x.id!==it.id);
    DB.saved = DB.saved.filter(s=>s.ids.every(i=>DB.items.some(x=>x.id===i)));
    save(); closeSheet(); renderAll(); toast('已删除');
  };
  sheet.appendChild(del);

  mask.classList.add('on');
}

function openBox(id){
  const b = DB.boxes.find(x=>x.id===id);
  if(!b) return;
  const inBox = DB.items.filter(i=>i.box===id);
  sheet.innerHTML='';

  const info = el('div','why');
  info.innerHTML = (b.place? esc(b.place)+' · ':'') + inBox.length + ' 件' + (b.note? ' · '+esc(b.note):'');
  sheet.appendChild(info);
  if(!inBox.length){
    sheet.appendChild(el('div','empty','这只箱子还是空的。换季时在「衣橱」里点批量选中，再「收进箱子」。'));
  }else{
    const c = el('div','card'); c.style.marginTop='12px'; c.style.overflow='hidden';
    inBox.forEach(it=>{
      const r = el('div','row');
      r.innerHTML = '<div class="th"><img src="'+it.photo+'" alt=""></div>'
        + '<div class="bd"><div class="t1">'+esc(it.name)+'</div><div class="t2">'+it.cat+' · '+(it.season||[]).join('/')+'</div></div>';
      r.onclick = ()=> openItem(it.id);
      c.appendChild(r);
    });
    sheet.appendChild(c);
  }
  const acts = el('div','outfit-actions');
  const bEdit = el('button','mini ghost','改编号/位置');

    if(!confirm('删掉这只箱子？里面的 '+inBox.length+' 件会回到「在衣橱」。')) return;
    DB.items.forEach(i=>{ if(i.box===id) i.box=''; });
    DB.boxes = DB.boxes.filter(x=>x.id!==id);
    save(); closeSheet(); renderAll(); toast('箱子已删');
  };
  acts.appendChild(bEdit); acts.appendChild(bDel);
  sheet.appendChild(acts);
  mask.classList.add('on');
}
function openBoxForm(cb, edit){
  const b = edit || {id:uid('b'), code:'', place:'', note:''};
  if(!edit){
    const n = DB.boxes.length+1;
    b.code = 'B' + String(n).padStart(2,'0');
  }
  sheet.innerHTML='';
  sheetHead(edit? '编辑箱子':'新建箱子');
  const f1 = el('div','field');
  f1.appendChild(el('div','lab','箱子编号（建议 B01、B02 顺序编）'));
  const ip = el('input'); ip.type='text'; ip.value = b.code; ip.placeholder='B01';
  ip.oninput = e=> b.code = e.target.value;
  f1.appendChild(ip); sheet.appendChild(f1);
  const f2 = el('div','field');
  f2.appendChild(el('div','lab','放在哪（床下 / 顶层柜 / 衣柜上层）'));
  const ip2 = el('input'); ip2.type='text'; ip2.value = b.place||''; ip2.placeholder='床下';
  ip2.oninput = e=> b.place = e.target.value;
  f2.appendChild(ip2); sheet.appendChild(f2);
  const cta = el('button','cta','存好');
  cta.onclick = ()=>{
    if(!b.code.trim()){ toast('给箱子一个编号'); return; }
    if(edit){ save(); closeSheet(); renderAll(); toast('改好了'); }
    else{
      DB.boxes.push(b); save();
      if(cb) cb(b); else { closeSheet(); renderAll(); }
      toast('已建箱 '+b.code);
    }
  };
  sheet.appendChild(cta);
  mask.classList.add('on');
}

/* ================= 加一件 ================= */
let draft = null;
function openAdd(){
  draft = {id:uid(), photo:null, name:'', cat:'上装', sub:'', color:'', hex:'#cccccc',
           season:[seasonByMonth()], scene:['通勤','休闲'], wear:'常穿', box:''};
  renderAddSheet();
}
function renderAddSheet(){
  sheet.innerHTML='';
  sheetHead('加一件');
  const f1 = el('div','field');
  f1.appendChild(el('div','lab','照片'));
  const pick = el('div','pick');
  pick.innerHTML = draft.photo
    ? '<img src="'+draft.photo+'" alt="">'
    : '<div class="tip">点这里拍照或选图<br><span class="sub">白底、平铺、白天拍，取色最准</span></div>';
  pick.onclick = ()=> document.getElementById('filePick').click();
  f1.appendChild(pick); sheet.appendChild(f1);

  const f2 = el('div','field');
  f2.appendChild(el('div','lab','叫什么（可空，自动起名）'));
  const nm = el('input'); nm.type='text'; nm.placeholder='白衬衫 / 深蓝直筒牛仔'; nm.value = draft.name;
  nm.oninput = e=> draft.name = e.target.value;
  f2.appendChild(nm); sheet.appendChild(f2);

  const f3 = el('div','field');
  f3.appendChild(el('div','lab','品类'));
  const c3 = el('div','chips');
  CATS.forEach(c=>{
    const b = el('button','chip'+(draft.cat===c?' on':''), c);
    b.onclick = ()=>{ draft.cat=c; draft.sub=''; renderAddSheet(); };
    c3.appendChild(b);
  });
  f3.appendChild(c3); sheet.appendChild(f3);

  const f4 = el('div','field');
  f4.appendChild(el('div','lab','具体款式（可空）'));
  const c4 = el('div','chips');
  (SUBCATS[draft.cat]||[]).forEach(s=>{
    const b = el('button','chip'+(draft.sub===s?' on':''), s);
    b.onclick = ()=>{ draft.sub = draft.sub===s?'':s; renderAddSheet(); };
    c4.appendChild(b);
  });
  f4.appendChild(c4); sheet.appendChild(f4);

  const f5 = el('div','field');
  f5.appendChild(el('div','lab','颜色'+(draft.hex?'（自动识别，可改）':'')));
  const c5 = el('div','colorbar');
  COLORS.forEach(c=>{
    const b = el('button','swatch'+(draft.color===c.n?' on':''), '<span class="dot" style="background:'+c.h+'"></span>'+c.n);
    b.onclick = ()=>{ draft.color=c.n; draft.hex=c.h; renderAddSheet(); };
    c5.appendChild(b);
  });
  f5.appendChild(c5); sheet.appendChild(f5);

  const f6 = el('div','field');
  f6.appendChild(el('div','lab','什么季节穿（可多选）'));
  const c6 = el('div','chips');
  SEASONS.forEach(s=>{
    const on = draft.season.includes(s);
    const b = el('button','chip'+(on?' on':''), s);
    b.onclick = ()=>{
      if(s==='四季') draft.season = on? [] : ['四季'];
      else{
        draft.season = draft.season.filter(x=>x!=='四季');
        draft.season = on? draft.season.filter(x=>x!==s) : draft.season.concat(s);
      }
      renderAddSheet();
    };
    c6.appendChild(b);
  });
  f6.appendChild(c6); sheet.appendChild(f6);

  const f7 = el('div','field');
  f7.appendChild(el('div','lab','什么场合穿（可多选）'));
  const c7 = el('div','chips');
  SCENES.forEach(s=>{
    const on = draft.scene.includes(s);
    const b = el('button','chip'+(on?' on':''), s);
    b.onclick = ()=>{ draft.scene = on? draft.scene.filter(x=>x!==s) : draft.scene.concat(s); renderAddSheet(); };
    c7.appendChild(b);
  });
  f7.appendChild(c7); sheet.appendChild(f7);

  const f8 = el('div','field');
  f8.appendChild(el('div','lab','这件穿得勤吗'));
  const c8 = el('div','chips');
  WEARS.forEach(w=>{
    const b = el('button','chip'+(draft.wear===w?' on':''), w);
    b.onclick = ()=>{ draft.wear=w; renderAddSheet(); };
    c8.appendChild(b);
  });
  f8.appendChild(c8); sheet.appendChild(f8);

  const cta = el('button','cta','存进衣橱');
  cta.disabled = !draft.photo;
  cta.onclick = commitDraft;
  sheet.appendChild(cta);
  mask.classList.add('on');
}
function commitDraft(){
  if(!draft.photo){ toast('先加一张照片'); return; }
  const name = (draft.name||'').trim() || (draft.color||'') + (draft.sub||draft.cat||'');
  DB.items.unshift({
    id: draft.id, photo: draft.photo, name, cat: draft.cat, sub: draft.sub,
    color: draft.color||'灰', hex: draft.hex||'#9b9b9b',
    season: draft.season.length? draft.season : ['四季'],
    scene: draft.scene.length? draft.scene : ['休闲'],
    wear: draft.wear, reason: draft.wear!=='常穿'? REASONS[0] : '',
    box: draft.box||'', status:'在穿', createdAt: Date.now()
  });
  save(); closeSheet(); renderAll(); toast('存好了 · '+name);
}

/* ================= 照片 ================= */
document.getElementById('filePick').onchange = async e=>{
  const file = e.target.files[0]; e.target.value='';
  if(!file) return;
  toast('正在处理照片…');
  try{
    const {dataURL, img} = await compress(file);
    const col = dominantColor(img);
    if(!draft) draft = {season:[seasonByMonth()], scene:['通勤','休闲'], cat:'上装', sub:'', wear:'常穿', box:'', name:'', id:uid()};
    draft.photo = dataURL; draft.color = col.name; draft.hex = col.hex;
    renderAddSheet();
    toast('识别到主色：'+col.name);
  }catch(err){ console.error(err); toast('这张图读不了，换一张'); }
};

/* ================= 拍照 / 批量入库 ================= */
function pendingCount(){ return DB.items.filter(i=>i.cat==='待分类').length; }
function nextUncatName(){ return '待分类 ' + (pendingCount()+1); }

async function importFiles(files){
  const arr = Array.prototype.slice.call(files||[]).filter(f=> !f.type || /^image\//.test(f.type));
  if(!arr.length){ quickMsg('拖进来的不是图片','支持 jpg / png / webp'); return; }
  const qb = document.getElementById('quickbar');
  qb.classList.add('on');
  let ok = 0, bad = 0;
  for(let i=0;i<arr.length;i++){
    quickMsg('正在处理 ' + (i+1) + '/' + arr.length + '…','');
    try{
      const r = await compress(arr[i]);
      pushItem(r.dataURL, dominantColor(r.img));
      document.getElementById('quickThumb').src = r.dataURL;
      ok++;
    }catch(e){ bad++; console.warn('读图失败', e); }
  }
  try{ save(); }catch(e){ console.warn(e); }
  quickMsg('入库 <b>' + ok + '</b> 件' + (bad? '，<b>'+bad+'</b> 张没读进来':'')
    , '共 ' + pendingCount() + ' 件待分类，点开补品类');
  renderAll();
  if(ok){ toast('已入库 ' + ok + ' 件'); goPending(); }
  else toast('一张也没读进来，换个格式试试');
}

document.getElementById('fileCam').onchange = e=>{
  const fs = e.target.files; e.target.value = '';
  if(fs && fs.length) importFiles(fs);
};
document.getElementById('fileAlbum').onchange = e=>{
  const fs = e.target.files; e.target.value = '';
  if(fs && fs.length) importFiles(fs);
};
document.getElementById('quickAgain').onclick = ()=> document.getElementById('fileCam').click();
document.getElementById('quickDone').onclick = ()=>{
  document.getElementById('quickbar').classList.remove('on');
  if(tab==='wardrobe'){ renderCats(); renderGrid(); }
};

/* ================= 拖进来就入库（带反馈） ================= */
let dragDepth = 0;
function dropHint(on){
  const dz = document.getElementById('dropzone');
  if(dz) dz.classList.toggle('on', on);
}
function quickMsg(title, sub){
  const qb = document.getElementById('quickbar');
  if(qb) qb.classList.add('on');
  const m = document.getElementById('quickMsg');
  if(m) m.innerHTML = title + (sub? '<small>'+sub+'</small>' : '');
}
function collectFiles(dt){
  const out = [];
  if(!dt) return out;
  if(dt.files && dt.files.length){
    for(let i=0;i<dt.files.length;i++) out.push(dt.files[i]);
  }else if(dt.items && dt.items.length){
    for(let i=0;i<dt.items.length;i++){
      const it = dt.items[i];
      if(it && it.kind==='file' && it.getAsFile){
        const f = it.getAsFile();
        if(f) out.push(f);
      }
    }
  }
  return out;
}
function imageUrlFrom(dt){
  try{
    const html = dt.getData && dt.getData('text/html');
    if(html){ const m = html.match(/<img[^>]+src=["']([^"']+)["']/i); if(m) return m[1]; }
    const uri = dt.getData && dt.getData('text/uri-list');
    if(uri) return uri.split('\n')[0].trim();
  }catch(e){}
  return '';
}
function pushItem(dataURL, col){
  DB.items.unshift({
    id: uid(), photo: dataURL, name: nextUncatName(), cat: '待分类', sub: '',
    color: (col&&col.name)||'灰', hex: (col&&col.hex)||'#9b9b9b',
    season: [seasonByMonth()], scene: ['通勤','休闲'],
    wear: '常穿', reason: '', box: '', status: '在穿', createdAt: Date.now()
  });
}
function importFromUrl(url){
  quickMsg('正在读这张图…','');
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = ()=>{
    try{
      const sc = Math.min(1, 760/Math.max(img.width, img.height));
      const w = Math.round(img.width*sc), h = Math.round(img.height*sc);
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      const dataURL = c.toDataURL('image/jpeg',0.72);
      pushItem(dataURL, dominantColor(img));
      save();
      document.getElementById('quickThumb').src = dataURL;
      quickMsg('入库 <b>1</b> 件','共 '+pendingCount()+' 件待分类');
      renderAll(); goPending();
    }catch(err){
      console.warn(err);
      quickMsg('这张图网页读不到','请先「图片另存为」，再把文件拖进来');
    }
  };
  img.onerror = ()=> quickMsg('这张图读不到','请先「图片另存为」，再把文件拖进来');
  img.src = url;
}
['dragenter','dragover'].forEach(ev=>{
  window.addEventListener(ev, e=>{
    e.preventDefault();
    if(ev==='dragenter') dragDepth++;
    if(e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
    dropHint(true);
  });
});
window.addEventListener('dragleave', e=>{
  e.preventDefault();
  dragDepth = Math.max(0, dragDepth-1);
  if(dragDepth===0) dropHint(false);
});
window.addEventListener('drop', e=>{
  e.preventDefault();
  dragDepth = 0; dropHint(false);
  const files = collectFiles(e.dataTransfer);
  if(files.length){ importFiles(files); return; }
  const src = imageUrlFrom(e.dataTransfer);
  if(src){ importFromUrl(src); return; }
  quickMsg('没读到图片','如果是从微信里直接拖的，先「另存为」或存到相册再试');
});

document.getElementById('btnExport').onclick = doExport;
document.getElementById('btnImport').onclick = ()=> document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = e=>{
  const f = e.target.files[0]; e.target.value=''; if(!f) return;
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const o = JSON.parse(fr.result);
      if(!Array.isArray(o.items)) throw new Error('bad');
      if(!confirm('导入会覆盖当前衣橱（'+DB.items.length+' 件），继续？')) return;
      DB.items=o.items; DB.saved=o.saved||[]; DB.boxes=o.boxes||[]; DB.gaps=o.gaps||[];
      save(); renderAll(); toast('已恢复 '+o.items.length+' 件');
    }catch(err){ toast('这个文件不是衣橱备份'); }
  };
  fr.readAsText(f);
};
document.getElementById('btnPrint').onclick = ()=>{
  const area = document.getElementById('printArea');
  area.innerHTML='';
  if(!DB.boxes.length){ toast('还没有箱子'); return; }
  DB.boxes.forEach(b=>{
    const inBox = DB.items.filter(i=>i.box===b.id);
    const d = el('div','pbox');
    d.innerHTML = '<h3>'+esc(b.code)+'</h3>'
      + '<div class="pmeta">'+(esc(b.place)||'位置未填')+' · '+inBox.length+' 件 · 我的衣橱</div>'
      + '<div class="plist">'+ inBox.map(i=>'<div>'+esc(i.name)+'（'+i.cat+'·'+i.color+'）</div>').join('') + '</div>';
    area.appendChild(d);
  });
  window.print();
};

/* ================= 启动 ================= */
function showTab(t){
  tab = t;
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on', x.dataset.tab===t));
  ['outfit','wardrobe','lists','saved'].forEach(k=>{ document.getElementById('tab-'+k).hidden = (k!==t); });
  if(t==='outfit') renderOutfits();
  if(t==='wardrobe'){ renderCats(); renderGrid(); }
  if(t==='lists') renderLists();
  if(t==='saved') renderSaved();
  if(window.scrollTo) window.scrollTo(0,0);
}
function goPending(){ curCat = '待分类'; showTab('wardrobe'); }
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.onclick = ()=> showTab(b.dataset.tab);
});
document.getElementById('fab').onclick = ()=> document.getElementById('fileCam').click();
document.getElementById('fabAlbum').onclick = ()=> document.getElementById('fileAlbum').click();
document.getElementById('fabManual').onclick = openAdd;

/* 电脑上没有相机：主按钮改成选照片，提示改成拖拽 */
(function(){
  const touch = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
  if(touch) return;
  const fb = document.getElementById('fab');
  if(fb){ fb.textContent = '🖼 选照片'; fb.onclick = ()=> document.getElementById('fileAlbum').click(); }
  const ab = document.getElementById('fabAlbum');
  if(ab) ab.style.display = 'none';
  const tp = document.getElementById('tipText');
  if(tp) tp.textContent = '电脑上直接把照片拖进窗口就行，也可以点「选照片」一次挑多张。';
})();
const tipClose = document.getElementById('tipClose');
if(tipClose) tipClose.onclick = ()=> document.getElementById('tipbar').classList.add('hide');
document.getElementById('chipUnworn').onclick = ()=>{ onlyUnworn = !onlyUnworn; renderSeasons(); renderOutfits(); };
document.getElementById('chipBatch').onclick = ()=>{ selectMode ? exitSelect() : enterSelect(); };
document.getElementById('btnAddBox').onclick = ()=> openBoxForm();

function renderAll(){
  renderSeasons(); renderOutfits();
  renderCats(); renderGrid();
  renderLists(); renderSaved();
}
load().then(mode=>{
  renderAll();
  if(mode === 'memory'){
    DB.memOnly = true;
    showStoreBanner();
    toast('这个浏览器不让存数据，先看顶部提示');
  }else if(mode === 'idb'){
    console.log('存储方式：IndexedDB');
  }
}).catch(err=>{
  console.warn('启动失败', err);
  applyDefaults();
  renderAll();
  showStoreBanner();
});

function showStoreBanner(){
  const bar = document.getElementById('warnbar');
  if(!bar) return;
  const ua = (navigator && navigator.userAgent) || '';
  const wechat = /MicroMessenger/i.test(ua);
  const isFile = (location && location.protocol === 'file:');
  let msg;
  if(isFile){
    msg = '你是双击本地文件打开的。Chrome / Edge 不允许本地文件存数据，'
        + '改用这个网址打开就行：<a href="https://conniefu2003.github.io/wardrobe/" target="_blank">conniefu2003.github.io/wardrobe</a>';
  }else if(wechat){
    msg = '你现在是在微信里打开的，微信不让网页存东西。点右上角「···」→「在浏览器打开」，再重新加一次照片。';
  }else{
    msg = '这个浏览器禁用了本地存储。换 Chrome / Safari 打开；iPhone 还要看一眼「设置 → Safari → 阻止所有 Cookie」是不是打开了。';
  }
  bar.innerHTML = '<b>数据存不下来</b><span>' + msg + '<br><small>'
    + esc(Store.err || '') + ' · ' + esc(location.protocol) + esc(location.host || '') + '</small></span>'
    + '<button class="mini" id="bannerExport">先导出备份</button>';
  bar.classList.add('on');
  const be = document.getElementById('bannerExport');
  if(be) be.onclick = doExport;
}
function doExport(){
  const blob = new Blob([JSON.stringify({items:DB.items, saved:DB.saved, boxes:DB.boxes, gaps:DB.gaps, v:2})], {type:'application/json'});
  const a = el('a'); a.href = URL.createObjectURL(blob);
  a.download = '我的衣橱备份_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); toast('已导出备份文件');
}
